<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OCT // On-Call Tracker</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="OCT" />
  <meta name="theme-color" content="#080808" />
  <link rel="manifest" id="pwa-manifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ── Same Firebase project as renal tracker ─────────────
     const firebaseConfig = {
        apiKey: "AIzaSyAhv0PJy95vqXdzOQkCqbg1FuXfiqHTnI0",
        authDomain: "task-monitor-bd7ee.firebaseapp.com",
        databaseURL: "https://task-monitor-bd7ee-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "task-monitor-bd7ee",
        storageBucket: "task-monitor-bd7ee.firebasestorage.app",
        messagingSenderId: "544624731364",
        appId: "1:544624731364:web:419d52fa061c5c7b4f38f1"
};

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
   
    // Different path from renalTasks — same project, separate data
    const tasksRef = ref(db, "onCallTasks");
    window._fb = { db, ref, push, onValue, update, remove, set, tasksRef };
    window.dispatchEvent(new Event("firebase-ready"));
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080808;
      --bg2:     #0d0d0d;
      --bg3:     #121212;
      --bg4:     #181818;

      /* Amber terminal — distinct from renal tracker's green */
      --amber:   #ffb000;
      --amber2:  #cc8c00;
      --amber3:  #996800;
      --amber4:  #664400;
      --amber5:  #332200;

      --red:     #ff3333;
      --orange:  #ff6600;
      --green:   #39ff14;
      --blue:    #00bfff;
      --dim:     #5a4a2a;
      --dimmest: #1a1208;

      --font: 'JetBrains Mono', 'Courier New', monospace;

      /* Priority colours */
      --p-emergency: #ff3333;
      --p-urgent:    #ff6600;
      --p-routine:   #ffb000;
    }

    html, body {
      background: var(--bg);
      color: var(--amber);
      font-family: var(--font);
      font-size: 13px;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--amber4); }

    /* ── Header ──────────────────────────────────────────── */
    #header {
      background: var(--bg2);
      border-bottom: 2px solid var(--amber3);
    }
    .header-top {
      display: flex; align-items: stretch;
      border-bottom: 1px solid var(--amber5);
    }
    .header-logo {
      padding: 14px 24px;
      border-right: 1px solid var(--amber5);
      display: flex; flex-direction: column; justify-content: center;
    }
    .logo-line1 {
      font-size: 20px; font-weight: 700;
      color: var(--amber); letter-spacing: 0.08em; line-height: 1;
    }
    .logo-line1 span { color: var(--amber3); }
    .logo-line2 { font-size: 8px; color: var(--amber3); letter-spacing: 0.3em; margin-top: 4px; }
    .logo-mode  { font-size: 9px; color: var(--amber2); letter-spacing: 0.15em; margin-top: 3px; }

    .header-stats { display: flex; flex: 1; }
    .stat-cell {
      flex: 1; padding: 10px 16px;
      border-right: 1px solid var(--amber5);
      display: flex; flex-direction: column; justify-content: center;
    }
    .stat-cell:last-child { border-right: none; }
    .stat-val {
      font-size: 26px; font-weight: 700; line-height: 1; color: var(--amber);
    }
    .stat-val.emerg { color: var(--red); }
    .stat-val.urg   { color: var(--orange); }
    .stat-key { font-size: 8px; color: var(--amber3); letter-spacing: 0.2em; margin-top: 3px; }

    .header-clock {
      padding: 10px 20px; min-width: 170px;
      border-left: 1px solid var(--amber5);
      display: flex; flex-direction: column;
      justify-content: center; align-items: flex-end;
    }
    .clock-time { font-size: 20px; font-weight: 700; color: var(--amber2); letter-spacing: 0.06em; }
    .clock-date { font-size: 9px; color: var(--amber3); margin-top: 3px; letter-spacing: 0.08em; }
    .shift-info { font-size: 8px; color: var(--amber4); margin-top: 5px; letter-spacing: 0.12em; }
    .sync-live  { font-size: 8px; color: var(--amber2); margin-top: 3px; letter-spacing: 0.15em; display: none; }
    .sync-dot   { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--amber2); margin-right: 4px; animation: blink 1.4s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Priority strip */
    #priority-strip {
      display: none;
      padding: 5px 24px; font-size: 10px; font-weight: 700;
      letter-spacing: 0.2em; text-shadow: none;
    }
    #priority-strip.show { display: block; animation: strobe 1.5s ease-in-out infinite; }
    #priority-strip.emerg   { background: var(--red);    color: #fff; }
    #priority-strip.urg     { background: var(--orange); color: #fff; }
    @keyframes strobe { 0%,100%{opacity:1} 50%{opacity:0.7} }

    /* ── Command bar ─────────────────────────────────────── */
    #cmdbar {
      background: var(--bg3); border-bottom: 1px solid var(--amber4);
      padding: 0 24px; display: flex; align-items: stretch;
    }
    .cmd-prompt {
      padding: 9px 10px 9px 0; color: var(--amber3); font-size: 11px;
      border-right: 1px solid var(--amber5); display: flex; align-items: center;
    }
    .cmd-btn {
      padding: 9px 13px; background: transparent; border: none;
      border-right: 1px solid var(--amber5);
      color: var(--amber3); font-family: var(--font);
      font-size: 10px; letter-spacing: 0.1em; cursor: pointer; transition: all 0.1s;
    }
    .cmd-btn:hover  { background: var(--bg4); color: var(--amber); }
    .cmd-btn.active { background: var(--amber5); color: var(--amber); }
    .cmd-select {
      padding: 9px 10px; background: transparent; border: none;
      border-right: 1px solid var(--amber5);
      color: var(--amber3); font-family: var(--font);
      font-size: 10px; letter-spacing: 0.08em; cursor: pointer; outline: none;
    }
    .cmd-select option { background: var(--bg3); color: var(--amber); }
    .cmd-right { margin-left: auto; display: flex; align-items: center; gap: 0; }
    .btn-handover {
      padding: 9px 16px; background: transparent;
      border-left: 1px solid var(--amber5); border-right: 1px solid var(--amber5);
      color: var(--amber3); font-family: var(--font);
      font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
      cursor: pointer; transition: all 0.12s;
    }
    .btn-handover:hover { background: var(--amber5); color: var(--amber); }
    .btn-new {
      padding: 9px 18px; background: var(--amber4); border: none;
      border-left: 1px solid var(--amber3);
      color: var(--amber); font-family: var(--font);
      font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
      cursor: pointer; transition: all 0.12s;
    }
    .btn-new:hover { background: var(--amber3); }
    .cmd-search {
      padding: 9px 10px;
      background: transparent; border: none;
      border-right: 1px solid var(--amber5);
      border-left: 1px solid var(--amber5);
      color: var(--amber); font-family: var(--font);
      font-size: 10px; letter-spacing: 0.08em;
      outline: none; width: 130px;
      caret-color: var(--amber);
      text-transform: uppercase;
    }
    .cmd-search::placeholder { color: var(--amber4); }
    .cmd-search:focus { background: var(--bg4); }
    .remind-grid { display: flex; gap: 6px; margin-top: 2px; }
.remind-btn {
  flex: 1; padding: 6px 4px; background: var(--bg);
  border: 1px solid var(--amber5); color: var(--dim);
  font-family: var(--font); font-size: 10px;
  letter-spacing: 0.08em; cursor: pointer; transition: all 0.12s;
  text-align: center;
}
.remind-btn.sel { background: var(--amber5); border-color: var(--amber); color: var(--amber); font-weight: 700; }

    /* ── Add / Edit drawer ───────────────────────────────── */
    #add-drawer {
      display: none; background: var(--bg2);
      border-bottom: 2px solid var(--amber3);
      animation: termSlide 0.15s ease;
    }
    #add-drawer.open { display: block; }
    @keyframes termSlide { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }

    .drawer-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 24px; border-bottom: 1px solid var(--amber5);
      background: var(--bg3);
    }
    .drawer-prompt { color: var(--amber3); font-size: 10px; letter-spacing: 0.15em; }
    .drawer-prompt strong { color: var(--amber); }
    .btn-esc {
      background: none; border: 1px solid var(--amber4);
      color: var(--amber3); font-family: var(--font);
      font-size: 9px; padding: 3px 8px; cursor: pointer; letter-spacing: 0.1em; transition: all 0.1s;
    }
    .btn-esc:hover { border-color: var(--amber); color: var(--amber); }

    .drawer-body {
      padding: 16px 24px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.s2 { grid-column: span 2; }
    .field.s4 { grid-column: span 4; }
    .lbl { font-size: 8px; color: var(--amber3); letter-spacing: 0.2em; text-transform: uppercase; }
    .lbl::before { content: "$ "; color: var(--amber4); }
    .inp {
      background: var(--bg); border: 1px solid var(--amber4);
      color: var(--amber); font-family: var(--font);
      font-size: 12px; padding: 7px 10px; outline: none;
      transition: border-color 0.12s; caret-color: var(--amber);
      text-transform: uppercase;
    }
    .inp:focus { border-color: var(--amber); box-shadow: 0 0 8px rgba(255,176,0,0.1); }
    .inp option { background: var(--bg); color: var(--amber); text-transform: none; }
    .inp.no-caps { text-transform: none; }
    textarea.inp { resize: vertical; min-height: 52px; text-transform: none; }

    /* Priority selector buttons */
    .priority-grid { display: flex; gap: 6px; }
    .pri-btn {
      flex: 1; padding: 8px 4px; background: var(--bg);
      border: 1px solid var(--amber5); color: var(--dim);
      font-family: var(--font); font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; cursor: pointer; transition: all 0.12s;
      text-align: center;
    }
    .pri-btn.sel-routine   { background: var(--amber5); border-color: var(--amber);  color: var(--amber); }
    .pri-btn.sel-urgent    { background: #2a1500;       border-color: var(--orange); color: var(--orange); }
    .pri-btn.sel-emergency { background: #2a0000;       border-color: var(--red);    color: var(--red); }

    /* Task type buttons */
    .type-grid { display: flex; flex-wrap: wrap; gap: 5px; }
    .type-btn {
      padding: 4px 10px; background: var(--bg); border: 1px solid var(--amber5);
      color: var(--dim); font-family: var(--font); font-size: 10px;
      cursor: pointer; transition: all 0.1s;
    }
    .type-btn:hover { border-color: var(--amber3); color: var(--amber2); }
    .type-btn.sel { background: var(--amber4); border-color: var(--amber); color: var(--amber); font-weight: 700; }

    .drawer-foot {
      padding: 10px 24px; border-top: 1px solid var(--amber5);
      display: flex; justify-content: flex-end; gap: 8px; background: var(--bg3);
    }
    .btn-abort {
      padding: 6px 16px; background: transparent;
      border: 1px solid var(--amber4); color: var(--amber3);
      font-family: var(--font); font-size: 9px; letter-spacing: 0.12em;
      cursor: pointer; transition: all 0.1s;
    }
    .btn-abort:hover { border-color: var(--red); color: var(--red); }
    .btn-exec {
      padding: 6px 20px; background: var(--amber4); border: 1px solid var(--amber);
      color: var(--amber); font-family: var(--font);
      font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
      cursor: pointer; transition: all 0.12s;
    }
    .btn-exec:hover { background: var(--amber3); }

    /* ── Task table ──────────────────────────────────────── */
    #task-table { width: 100%; border-collapse: collapse; display: none; }
    #task-table.show { display: table; }

    .tbl-head { background: var(--bg3); border-bottom: 2px solid var(--amber3); }
    .tbl-head th {
      padding: 6px 12px; font-size: 8px; font-weight: 700;
      letter-spacing: 0.2em; color: var(--amber3); text-align: left; white-space: nowrap;
    }

    .tbl-section td {
      padding: 10px 12px 4px; font-size: 9px; font-weight: 700;
      letter-spacing: 0.25em; color: var(--amber3); text-transform: uppercase;
      border-bottom: 1px solid var(--amber5);
    }
    .tbl-section td::before { content: "── "; color: var(--amber5); }
    .tbl-section td::after  { content: " " attr(data-count) " ────────────────────────────────"; color: var(--amber5); }

    .tbl-row {
      border-bottom: 1px solid var(--dimmest);
      transition: background 0.08s, opacity 0.7s ease;
      animation: rowIn 0.18s ease;
    }
    @keyframes rowIn { from{opacity:0;transform:translateX(-4px)} to{opacity:1;transform:translateX(0)} }
    .tbl-row.new-pulse {
      animation: rowIn 0.18s ease, newPulse 1.8s ease-out 1;
    }
    @keyframes newPulse {
      0%   { background: rgba(255,176,0,0.32); box-shadow: inset 3px 0 0 var(--amber); }
      60%  { background: rgba(255,176,0,0.14); box-shadow: inset 3px 0 0 var(--amber2); }
      100% { background: transparent;          box-shadow: inset 3px 0 0 transparent; }
    }
    .tbl-row:hover { background: var(--bg3); }
    .tbl-row.done  { opacity: 0.3; }
    .tbl-row td    { padding: 8px 12px; vertical-align: middle; font-size: 12px; }

    /* Checkbox */
    .td-cb { width: 28px; }
    .cb {
      width: 16px; height: 16px; border: 1px solid var(--amber4);
      background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: var(--amber);
      transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .cb.checked { background: var(--amber4); border-color: var(--amber); box-shadow: 0 0 8px rgba(255,176,0,0.35); }
    .cb:active  { transform: scale(0.82); }

    /* Priority cell */
    .td-pri { width: 100px; }
    .pri-badge {
      font-size: 8px; font-weight: 700; letter-spacing: 0.12em;
      padding: 2px 6px; text-transform: uppercase; display: inline-block;
    }
    .pri-emergency { color: var(--red);    background: rgba(255,51,51,0.12);  border: 1px solid rgba(255,51,51,0.35); }
    .pri-urgent    { color: var(--orange); background: rgba(255,102,0,0.1);   border: 1px solid rgba(255,102,0,0.3); }
    .pri-routine   { color: var(--amber);  background: rgba(255,176,0,0.07);  border: 1px solid rgba(255,176,0,0.2); }

    /* Patient cell */
    .td-patient { width: 80px; white-space: nowrap; }
    .patient-str { color: var(--amber2); font-weight: 700; font-size: 11px; letter-spacing: 0.06em; }

    /* Type cell */
    .td-type { width: 100px; }
    .type-pill {
      font-size: 8px; font-weight: 700; letter-spacing: 0.1em;
      padding: 2px 6px; border-left: 2px solid; text-transform: uppercase;
    }

    /* Task cell */
    .td-task { min-width: 180px; cursor: pointer; }
    .task-str { color: var(--amber); font-size: 12px; font-weight: 500; }
    .task-notes {
      display: none; margin-top: 5px; font-size: 10px; color: var(--dim);
      padding-left: 10px; border-left: 1px solid var(--amber5); line-height: 1.5;
    }
    .tbl-row.expanded .task-notes { display: block; }

    /* Time cell */
    .td-time { width: 60px; text-align: right; white-space: nowrap; }
    .time-str { font-size: 12px; font-weight: 700; color: var(--amber2); }
    .time-age { font-size: 9px; color: var(--amber4); margin-top: 2px; }

    /* Actions cell */
    .td-actions { width: 110px; text-align: right; white-space: nowrap; }
    .edt {
      background: none; border: 1px solid var(--amber5);
      color: var(--amber4); font-family: var(--font);
      font-size: 9px; letter-spacing: 0.08em;
      cursor: pointer; padding: 2px 6px; transition: all 0.1s;
    }
    .edt:hover { border-color: var(--amber2); color: var(--amber2); }
    .dup {
      background: none; border: 1px solid var(--amber5);
      color: var(--amber4); font-family: var(--font);
      font-size: 9px; letter-spacing: 0.08em;
      cursor: pointer; padding: 2px 6px; transition: all 0.1s;
    }
    .dup:hover { border-color: var(--green); color: var(--green); }
    .del {
      background: none; border: none; color: var(--amber5);
      font-family: var(--font); font-size: 11px; cursor: pointer;
      transition: color 0.1s; padding: 2px 4px;
    }
    .del:hover { color: var(--red); }

    /* Row priority left borders */
    .tbl-row.p-emergency { border-left: 3px solid var(--red);    background: rgba(255,51,51,0.03); }
    .tbl-row.p-urgent    { border-left: 3px solid var(--orange);  background: rgba(255,102,0,0.02); }
    .tbl-row.p-routine   { border-left: 3px solid var(--amber4); }

    /* ── Handover overlay ────────────────────────────────── */
    #handover-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(8,8,8,0.96); z-index: 200;
      align-items: center; justify-content: center;
    }
    #handover-overlay.show { display: flex; }
    .handover-box {
      background: var(--bg2); border: 1px solid var(--amber3);
      border-top: 3px solid var(--amber); padding: 0;
      max-width: 560px; width: 92%; max-height: 85vh;
      display: flex; flex-direction: column;
    }
    .ho-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; border-bottom: 1px solid var(--amber5);
      background: var(--bg3);
    }
    .ho-title { font-size: 11px; font-weight: 700; color: var(--amber); letter-spacing: 0.2em; }
    .ho-title::before { content: ">> "; color: var(--amber3); }
    .btn-ho-close {
      background: none; border: 1px solid var(--amber4); color: var(--amber3);
      font-family: var(--font); font-size: 9px; padding: 3px 8px; cursor: pointer;
    }
    .btn-ho-close:hover { border-color: var(--amber); color: var(--amber); }
    .ho-body {
      flex: 1; overflow-y: auto; padding: 0;
    }
    .ho-text {
      padding: 16px 20px; font-size: 11px; line-height: 1.9;
      color: var(--amber2); white-space: pre-wrap; font-family: var(--font);
      background: var(--bg);
    }
    .ho-foot {
      padding: 12px 20px; border-top: 1px solid var(--amber5);
      display: flex; gap: 8px; justify-content: flex-end; background: var(--bg3);
    }
    .btn-copy {
      padding: 8px 22px; background: var(--amber4); border: 1px solid var(--amber);
      color: var(--amber); font-family: var(--font);
      font-size: 10px; font-weight: 700; letter-spacing: 0.15em; cursor: pointer;
      transition: all 0.12s;
    }
    .btn-copy:hover   { background: var(--amber3); }
    .btn-copy.copied  { background: #0a3204; border-color: var(--green); color: var(--green); }

    /* ── Config overlay ──────────────────────────────────── */
    #config-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(8,8,8,0.97); z-index: 300;
      align-items: center; justify-content: center;
    }
    #config-overlay.show { display: flex; }
    .config-box {
      background: var(--bg2); border: 1px solid var(--amber3);
      padding: 28px; max-width: 460px; width: 90%;
    }
    .config-title { font-size: 13px; font-weight: 700; color: var(--amber); letter-spacing: 0.15em; margin-bottom: 4px; }
    .config-title::before { content: "// "; color: var(--amber4); }
    .config-sub   { font-size: 10px; color: var(--amber3); margin-bottom: 18px; line-height: 1.7; }
    .config-fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .config-field  { display: flex; flex-direction: column; gap: 4px; }
    .config-lbl    { font-size: 8px; color: var(--amber3); letter-spacing: 0.2em; }
    .config-lbl::before { content: "$ "; color: var(--amber4); }
    .config-inp {
      background: var(--bg); border: 1px solid var(--amber4);
      color: var(--amber); font-family: var(--font); font-size: 11px;
      padding: 7px 10px; outline: none; transition: border-color 0.12s;
    }
    .config-inp:focus { border-color: var(--amber); }
    .btn-connect {
      width: 100%; padding: 10px; background: var(--amber4);
      border: 1px solid var(--amber); color: var(--amber);
      font-family: var(--font); font-size: 10px; font-weight: 700;
      letter-spacing: 0.2em; cursor: pointer;
    }
    .btn-connect:hover { background: var(--amber3); }
    .config-note { margin-top: 12px; font-size: 9px; color: var(--amber4); line-height: 1.8; }

    /* ── Loading / empty / statusbar ─────────────────────── */
    #loading {
      padding: 50px 24px; text-align: center;
      color: var(--amber3); font-size: 11px; letter-spacing: 0.15em;
    }
    .spinner {
      width: 20px; height: 20px; margin: 0 auto 12px;
      border: 1px solid var(--amber4); border-top-color: var(--amber);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #empty {
      display: none; padding: 50px 24px; text-align: center;
      color: var(--amber4); font-size: 11px; letter-spacing: 0.2em;
    }
    #empty::before { content: "> "; }

    #statusbar {
      position: sticky; bottom: 0;
      background: var(--bg3); border-top: 1px solid var(--amber4);
      padding: 6px 24px; display: flex; justify-content: space-between; align-items: center;
    }
    .status-left { display: flex; gap: 20px; align-items: center; }
    .status-item { font-size: 9px; color: var(--amber3); letter-spacing: 0.1em; }
    .status-item strong { color: var(--amber); }
    .btn-clr {
      background: transparent; border: 1px solid var(--amber5);
      color: var(--amber4); font-family: var(--font);
      font-size: 9px; letter-spacing: 0.1em; padding: 3px 10px; cursor: pointer; transition: all 0.1s;
    }
    .btn-clr:hover { border-color: var(--red); color: var(--red); }

    /* Mobile bottom bar: hidden by default, shown only on mobile */
    #mobile-bar { display: none; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 680px) {
      .header-clock { display: none; }
      .header-stats .stat-cell:nth-child(n+4) { display: none; }
      .drawer-body { grid-template-columns: 1fr 1fr; }
      .field.s4 { grid-column: span 2; }

      /* Top NEW_JOB/HANDOVER move to the bottom bar */
      .cmd-right .btn-handover,
      .cmd-right .btn-new { display: none; }
      .cmd-right { flex: 1; min-width: 0; }
      .cmd-search { width: 100%; flex: 1; }

      /* ── Table → card layout ──────────────────────────── */
      #task-table, #task-table > tbody { display: block; width: 100%; }
      #task-table > thead { display: none; }

      /* Section separator restyled for card flow */
      .tbl-section { display: block; }
      .tbl-section td {
        display: block; padding: 14px 14px 4px;
        font-size: 9px; border-bottom: none;
      }
      .tbl-section td::after { content: ""; }

      /* Each row becomes a card */
      .tbl-row {
        display: block; position: relative;
        margin: 8px 12px;
        padding: 14px 56px 12px 14px;   /* right pad reserves space for checkbox */
        background: var(--bg2);
        border: 1px solid var(--amber5);
        border-left: 4px solid var(--amber);
        border-bottom: 1px solid var(--amber5);
      }
      .tbl-row.p-emergency { border-left-color: var(--red); }
      .tbl-row.p-urgent    { border-left-color: var(--orange); }
      .tbl-row.p-routine   { border-left-color: var(--amber); }
      .tbl-row:hover { background: var(--bg2); }   /* no hover state on touch */

      .tbl-row td {
        display: block; padding: 0;
        border: none; vertical-align: top;
        width: auto !important; min-width: 0;
        white-space: normal;
      }

      /* Checkbox: large tap target, top-right corner */

<script>
// ── Constants ────────────────────────────────────────────────
const JOB_TYPES = [
  { label:"Handover",     key:"handover",     color:"#ffb000" },
  { label:"Referral In",  key:"referral-in",  color:"#00bfff" },
  { label:"Referral Out", key:"referral-out", color:"#bf7fff" },
  { label:"Review",       key:"review",       color:"#39ff14" },
  { label:"Bloods",       key:"bloods",       color:"#ff9944" },
  { label:"Imaging",      key:"imaging",      color:"#ff9944" },
  { label:"Procedure",    key:"procedure",    color:"#ff6600" },
  { label:"Escalation",   key:"escalation",   color:"#ff3333" },
  { label:"Other",        key:"other",        color:"#5a4a2a" },
];
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxQNlt-BhB6dNuvksNHsyJCb5LwTHYdRz4HX8UZ4QVQml2RZgyVfJKVqdF4zE0Q-Hw/exec";
const PRI_ORDER = { emergency: 0, urgent: 1, routine: 2 };
const IMMINENT_MS = 15 * 60 * 1000;   // flash strip when something is due within this window (or overdue)

// ── Offline cache + write queue ──────────────────────────────
// Tasks are cached in localStorage so the UI works on cold start when offline.
// Writes are queued in localStorage; the queue survives page reloads and is
// flushed to Firebase whenever the connection comes back.
const LS_CACHE = "oct_tasks_cache";
const LS_QUEUE = "oct_pending_ops";
let fbConnected = false;
let flushInFlight = false;

function lsLoad(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e) { return fallback; }
}
function lsSave(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

const saveCache = () => lsSave(LS_CACHE, tasks);
const getQueue  = () => lsLoad(LS_QUEUE, []);
const setQueueLS = (q) => lsSave(LS_QUEUE, q);

function generateLocalId() {
  return "loc_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
}

const isOnline = () => navigator.onLine && fbConnected;

function updateSyncStatus() {
  const el = document.getElementById("sb-sync");
  if (!el) return;
  const qLen = getQueue().length;
  if (!isOnline()) {
    el.textContent = qLen ? `db: offline · ${qLen} queued` : "db: offline";
    el.style.color = "var(--orange)";
    const live = document.getElementById("sync-live");
    if (live) live.style.display = "none";
  } else if (qLen) {
    el.textContent = `db: syncing · ${qLen} pending`;
    el.style.color = "var(--amber2)";
  } else {
    el.textContent = "db: connected";
    el.style.color = "var(--amber3)";
    const live = document.getElementById("sync-live");
    if (live) live.style.display = "block";
  }
}

// Apply an op to local `tasks` state (optimistic update). Used by both
// queuedWrite (immediate apply) and the onValue handler (replaying queue
// on top of fresh Firebase data so optimistic changes don't disappear).
function applyOpLocally(op) {
  const m = op.path.match(/^onCallTasks\/(.+)$/);
  if (m) {
    const id = m[1];
    if (op.type === "remove") delete tasks[id];
    else if (op.type === "update") tasks[id] = { ...(tasks[id] || {}), ...op.data };
    else if (op.type === "set")    tasks[id] = op.data;
  } else if (op.path === "onCallTasks" && op.type === "set" && op.data === null) {
    tasks = {};
  }
}

// Queue + apply optimistically + try to flush
function queuedWrite(op) {
  applyOpLocally(op);
  saveCache();
  render();
  const q = getQueue();
  q.push(op);
  setQueueLS(q);
  updateSyncStatus();
  flushQueue();
}

async function flushQueue() {
  if (flushInFlight || !isOnline() || !window._fb) return;
  flushInFlight = true;
  try {
    const { db, ref, set, update, remove } = window._fb;
    let q = getQueue();
    while (q.length) {
      const op = q[0];
      try {
        const fbRef = ref(db, op.path);
        if      (op.type === "set")    await set(fbRef, op.data);
        else if (op.type === "update") await update(fbRef, op.data);
        else if (op.type === "remove") await remove(fbRef);
        q.shift();
        setQueueLS(q);
        updateSyncStatus();
      } catch (err) {
        console.warn("[OCT] sync failed, will retry:", op, err);
        break;
      }
    }
  } finally {
    flushInFlight = false;
    updateSyncStatus();
  }
}

// Browser-level online/offline events
window.addEventListener("online",  () => { updateSyncStatus(); flushQueue(); });
window.addEventListener("offline", () => { updateSyncStatus(); });

// ── State ────────────────────────────────────────────────────
let tasks = {}, filterStatus="active", filterPri="all", filterType="all";
let selPriority  = "routine";
let selType      = JOB_TYPES[0];
let selRemind    = 0;
let selRemindAt  = null; 
let editingId    = null;
let shiftStart   = Date.now();
let knownTaskIds = null;   // null until first render; tracks IDs to detect newly added tasks
// ── Helpers ──────────────────────────────────────────────────
const nowTimeStr = () => new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const esc        = s  => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmtTime    = s  => s || "--:--";
const typeObj    = k  => JOB_TYPES.find(t=>t.key===k) || JOB_TYPES[JOB_TYPES.length-1];

// Age: prefer new `age` field, fall back to legacy `dobYear` for old records
function getAge(t) {
  if (t.age) return parseInt(t.age);
  if (t.dobYear) return new Date().getFullYear() - parseInt(t.dobYear);
  return null;
}

function timeAgo(timeStr) {
  if (!timeStr) return "";
  const [h,m] = timeStr.split(":").map(Number);
  const now = new Date();
  const then = new Date();
  then.setHours(h, m, 0, 0);
  const diff = Math.round((now - then) / 60000);
  if (diff < 0)   return "";
  if (diff < 60)  return `${diff}m ago`;
  return `${Math.floor(diff/60)}h ${diff%60}m`;
}

// ── Clock ────────────────────────────────────────────────────
function tickClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  document.getElementById("clock-date").textContent =
    now.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short"}).toUpperCase();
  // Shift duration
  const mins = Math.floor((Date.now() - shiftStart) / 60000);
  const h = Math.floor(mins/60), m = mins%60;
  document.getElementById("shift-duration").textContent =
    `shift: ${h}h ${m}m`;
}
tickClock();
setInterval(tickClock, 1000);


// ── Firebase ─────────────────────────────────────────────────
// Hydrate from localStorage immediately so the UI works offline on cold start.
const cachedTasks = lsLoad(LS_CACHE, null);
if (cachedTasks && Object.keys(cachedTasks).length) {
  tasks = cachedTasks;
  // Replay any queue on top so optimistic-but-not-yet-synced changes show
  for (const op of getQueue()) applyOpLocally(op);
  render();
  document.getElementById("loading").style.display = "none";
  document.getElementById("task-table").classList.add("show");
}
updateSyncStatus();

function initFirebase() {
  const { onValue, tasksRef, ref, db } = window._fb;

  // Track Firebase's own connection state separately from navigator.onLine.
  // navigator.onLine can lie (captive portals, partial connectivity).
  onValue(ref(db, ".info/connected"), snap => {
    fbConnected = snap.val() === true;
    updateSyncStatus();
    if (fbConnected) flushQueue();
  });

  onValue(tasksRef, snap => {
    // Firebase is source of truth on the read side. Replace local state
    // with whatever Firebase says, then layer any not-yet-flushed queued
    // ops on top so optimistic changes don't disappear mid-flight.
    tasks = snap.val() || {};
    for (const op of getQueue()) applyOpLocally(op);
    saveCache();
    render();
    document.getElementById("loading").style.display = "none";
    document.getElementById("task-table").classList.add("show");
    updateSyncStatus();
  });
}

if (window._fb) {
  initFirebase();
} else {
  window.addEventListener("firebase-ready", initFirebase);
}
// ── Type grid ────────────────────────────────────────────────
function buildTypeGrid() {
  const grid = document.getElementById("type-grid");
  grid.innerHTML = "";
  JOB_TYPES.forEach(t => {
    const b = document.createElement("button");
    b.className = "type-btn" + (t.key===selType.key?" sel":"");
    b.textContent = t.label;
    b.onclick = () => { selType = t; buildTypeGrid(); };
    grid.appendChild(b);
  });
}

// ── Priority selector ────────────────────────────────────────
function setPriority(p) {
  selPriority = p;
  document.querySelectorAll(".pri-btn").forEach(b => {
    const bp = b.dataset.p;
    b.className = "pri-btn" + (bp===p ? ` sel-${bp}` : "");
  });
}
// -set reminder-----
function setRemind(mins) {
  selRemind   = mins;
  selRemindAt = null;
  document.querySelectorAll(".remind-btn").forEach(b => {
    b.classList.toggle("sel", parseInt(b.dataset.r) === mins);
  });
  // Clear the time picker if a relative time is chosen
  document.getElementById("f-remind-at").value = "";
}

function setRemindAt(timeStr) {
  selRemindAt = timeStr || null;
  // If a specific time is set, deselect the relative buttons
  if (selRemindAt) {
    selRemind = 0;
    document.querySelectorAll(".remind-btn").forEach(b => b.classList.remove("sel"));
    document.querySelector(".remind-btn[data-r='0']").classList.add("sel");
  }
}

// ── Drawer ───────────────────────────────────────────────────
function openDrawer(taskId) {
  editingId = taskId || null;
  const task = editingId ? tasks[editingId] : null;

  document.getElementById("drawer-mode-label").textContent = task ? "job.edit" : "job.create";
  document.getElementById("drawer-exec-btn").textContent   = task ? "UPDATE ▸" : "EXECUTE ▸";

  if (task) {
    document.getElementById("f-patient").value  = task.patient  || "";
    document.getElementById("f-age").value      = task.age || (task.dobYear ? (new Date().getFullYear() - parseInt(task.dobYear)) : "");
    document.getElementById("f-location").value = task.location || "";
    document.getElementById("f-time").value     = task.timeIn   || "";
    document.getElementById("f-task").value     = task.task     || "";
    document.getElementById("f-notes").value    = task.notes    || "";
    // Pre-fill reminder time if it was a specific time
    if (task.remindAt && !task.reminded) {
      const d = new Date(task.remindAt);
      const hh = String(d.getHours()).padStart(2,"0");
      const mm = String(d.getMinutes()).padStart(2,"0");
      document.getElementById("f-remind-at").value = `${hh}:${mm}`;
      selRemindAt = `${hh}:${mm}`;
    } else {
      document.getElementById("f-remind-at").value = "";
      selRemindAt = null;
    }
    selPriority = task.priority || "routine";
    selType = typeObj(task.type);
    setPriority(selPriority);
  } else {
        ["f-patient","f-age","f-location","f-task","f-notes"].forEach(id=>document.getElementById(id).value="");

    document.getElementById("f-time").value   = nowTimeStr();
    selPriority = "routine";
    selType = JOB_TYPES[0];
    setPriority("routine");

    selRemind   = 0;
    selRemindAt = null;
    setRemind(0);
    document.getElementById("f-remind-at").value = "";
  }
  buildTypeGrid();
  document.getElementById("add-drawer").classList.add("open");
  document.getElementById("f-patient").focus();
}
function closeDrawer() {
  document.getElementById("add-drawer").classList.remove("open");
  editingId = null;
  selRemind   = 0;
  selRemindAt = null;
}

// ── Save job ─────────────────────────────────────────────────
function saveJob() {
  const patient = document.getElementById("f-patient").value.trim().toUpperCase();
  const task    = document.getElementById("f-task").value.trim();
  if (!patient || !task) {
    if (!patient) document.getElementById("f-patient").focus();
    else          document.getElementById("f-task").focus();
    return;
  }

  // Calculate absolute reminder time if set
// Specific time takes priority over relative offset
  let remindAt = null;
  if (selRemindAt) {
    // Convert "HH:MM" to today's epoch ms
    const [h, m] = selRemindAt.split(":").map(Number);
    const t = new Date();
    t.setHours(h, m, 0, 0);
    // If the time has already passed today, assume they mean tomorrow
    if (t.getTime() < Date.now()) t.setDate(t.getDate() + 1);
    remindAt = t.getTime();
  } else if (selRemind > 0) {
    remindAt = Date.now() + (selRemind * 60 * 1000);
  }

  const payload = {
    patient,
    age:      document.getElementById("f-age").value || "",
    location: document.getElementById("f-location").value.trim(),
    timeIn:   document.getElementById("f-time").value,
    priority: selPriority,
    type:     selType.key,
    task,
    notes:    document.getElementById("f-notes").value.trim(),
    remindAt,          // epoch ms, null if no reminder
    reminded: false,   // flipped to true once Apps Script fires it
  };


  if (editingId) {
    queuedWrite({ type: "update", path: `onCallTasks/${editingId}`, data: payload });
  } else {
    const id = generateLocalId();
    queuedWrite({
      type: "set",
      path: `onCallTasks/${id}`,
      data: { ...payload, completed: false, createdAt: Date.now(), completedAt: null }
    });
  }
  closeDrawer();
}

// ── Mutations ────────────────────────────────────────────────
function toggleDone(id) {
  const t = tasks[id]; if (!t) return;
  queuedWrite({
    type: "update",
    path: `onCallTasks/${id}`,
    data: {
      completed: !t.completed,
      completedAt: !t.completed ? Date.now() : null,
    }
  });
  const el = document.querySelector(`#tr-${id} .cb`);
  if (el) { el.style.transform="scale(1.35)"; setTimeout(()=>el.style.transform="",180); }
}
function deleteJob(id) {
  queuedWrite({ type: "remove", path: `onCallTasks/${id}` });
}
function toggleExpand(id) {
  document.getElementById("tr-"+id)?.classList.toggle("expanded");
}
  function duplicateJob(id) {
  const t = tasks[id]; if (!t) return;
  // Open drawer pre-filled with patient details, cleared task/notes/reminder
  editingId = null;
  const task = { ...t };

  document.getElementById("drawer-mode-label").textContent = "job.create";
  document.getElementById("drawer-exec-btn").textContent   = "EXECUTE ▸";

  document.getElementById("f-patient").value  = task.patient  || "";
    document.getElementById("f-age").value      = task.age || (task.dobYear ? (new Date().getFullYear() - parseInt(task.dobYear)) : "");
  

  document.getElementById("f-location").value = task.location || "";
  document.getElementById("f-time").value     = nowTimeStr();
  document.getElementById("f-task").value     = "";
  document.getElementById("f-notes").value    = "";
  document.getElementById("f-remind-at").value = "";

  selPriority = task.priority || "routine";
  selType     = typeObj(task.type);
  selRemind   = 0;
  selRemindAt = null;

  setPriority(selPriority);
  buildTypeGrid();
  setRemind(0);

  document.getElementById("add-drawer").classList.add("open");
  document.getElementById("f-task").focus();
}
function clearShift() {
  if (!confirm("END_SHIFT: clear all tasks? This cannot be undone.")) return;
  queuedWrite({ type: "set", path: "onCallTasks", data: null });
}

// ── Handover export ──────────────────────────────────────────
function openHandover() {
  const all = Object.values(tasks);
  const now = new Date();
  const dateStr = now.toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).toUpperCase();
  const timeStr = now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  const D = "═".repeat(52);
  const d = "─".repeat(52);
  const PRI_ICON = { emergency:"!!", urgent:"▲ ", routine:"── " };

  let out = "";
  out += `${D}\n`;
  out += `  OCT // ON-CALL HANDOVER\n`;
  out += `  ${dateStr}\n`;
  out += `  Generated :: ${timeStr}\n`;
  out += `${D}\n\n`;

  const pending   = all.filter(t=>!t.completed).sort((a,b)=>PRI_ORDER[a.priority]-PRI_ORDER[b.priority]);
  const completed = all.filter(t=> t.completed).sort((a,b)=>(a.timeIn||"").localeCompare(b.timeIn||""));

  if (pending.length) {
    out += `  OUTSTANDING JOBS (${pending.length})\n`;
    out += `${d}\n`;
    pending.forEach((t, i) => {
      const icon    = PRI_ICON[t.priority] || "── ";
      const pri     = (t.priority||"routine").toUpperCase();
      const age     = getAge(t);
      const patient = `${t.patient||"?"}${age?" (age "+age+")":""}`;
      const type    = (t.type||"other").toUpperCase();
      const time    = t.timeIn || "??:??";
      const dueStr = t.remindAt ? String(new Date(t.remindAt).getHours()).padStart(2,"0")+":"+String(new Date(t.remindAt).getMinutes()).padStart(2,"0") : time;
      out += `\n  ${icon} [${pri}] ${patient} :: ${type} :: @${dueStr}\n`;

      out += `     TASK   : ${t.task}\n`;
      if (t.location) out += `     WARD   : ${t.location}\n`;
      if (t.notes)    out += `     NOTES  : ${t.notes}\n`;
      if (i < pending.length - 1) out += `  ${" ".repeat(50)}\n`;
    });
    out += `\n${d}\n\n`;
  }

  if (completed.length) {
    out += `  COMPLETED JOBS (${completed.length})\n`;
    out += `${d}\n`;
    completed.forEach(t => {
      const age     = getAge(t);
      const patient = `${t.patient||"?"}${age?" (age "+age+")":""}`;

      const type    = (t.type||"other").toUpperCase();
      const time    = t.timeIn || "??:??";
      const dueStr = t.remindAt ? String(new Date(t.remindAt).getHours()).padStart(2,"0")+":"+String(new Date(t.remindAt).getMinutes()).padStart(2,"0") : time;
      const cIcon = "✓ ";
      const cPri  = (t.priority||"routine").toUpperCase();
      out += `\n  ${cIcon} [${cPri}] ${patient} :: ${type} :: @${dueStr}\n`;
      out += `     TASK   : ${t.task}\n`;
      if (t.notes) out += `     NOTES  : ${t.notes}\n`;
  
    });
    out += `\n${d}\n\n`;
  }

  if (!pending.length && !completed.length) {
    out += `  // no jobs recorded this shift\n\n`;
  }

  const pendingCt   = pending.length;
  const emergCt     = pending.filter(t=>t.priority==="emergency").length;
  const urgCt       = pending.filter(t=>t.priority==="urgent").length;
  const routineCt   = pending.filter(t=>t.priority==="routine").length;

  out += `${D}\n`;
  out += `  SUMMARY\n`;
  out += `  Outstanding : ${pendingCt}`;
  if (emergCt)   out += `  (!! ${emergCt} emergency)`;
  if (urgCt)     out += `  (▲ ${urgCt} urgent)`;
  if (routineCt) out += `  (── ${routineCt} routine)`;
  out += `\n`;
  out += `  Completed   : ${completed.length}\n`;
  out += `${D}\n`;
  out += `  OCT v1.0 // on-call tracker // ${dateStr}\n`;
  out += `${D}`;

  document.getElementById("ho-text").textContent = out;
  document.getElementById("copy-btn").textContent = "COPY TO CLIPBOARD ▸";
  document.getElementById("copy-btn").classList.remove("copied");
  document.getElementById("handover-overlay").classList.add("show");
}
function closeHandover() {
  document.getElementById("handover-overlay").classList.remove("show");
}
function copyHandover() {
  const text = document.getElementById("ho-text").textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copy-btn");
    btn.textContent = "✓ COPIED";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = "COPY TO CLIPBOARD ▸";
      btn.classList.remove("copied");
    }, 2500);
  });
}

function emailHandover() {
  const btn  = document.getElementById("email-btn");
  const text = document.getElementById("ho-text").textContent;
  btn.textContent = "SENDING...";
  btn.style.opacity = "0.6";

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "handover",
      text: text,
      date: new Date().toLocaleDateString("en-GB", { weekday:"long", day:"2-digit", month:"long", year:"numeric" }),
      time: new Date().toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" }),
    }),
  }).then(() => {
    btn.textContent = "✓ SENT";
    btn.style.borderColor = "var(--green)";
    btn.style.color = "var(--green)";
    btn.style.opacity = "1";
    setTimeout(() => {
      btn.textContent = "EMAIL ▸";
      btn.style.borderColor = "";
      btn.style.color = "";
    }, 3000);
  }).catch(() => {
    btn.textContent = "✗ FAILED";
    btn.style.color = "var(--red)";
    setTimeout(() => { btn.textContent = "EMAIL ▸"; btn.style.color = ""; }, 3000);
  });
}


// ── Priority strip ───────────────────────────────────────────
// Strip appears AND strobes together — visibility still tied to imminence
// (a pending job within IMMINENT_MS of its remindAt, or overdue), but the
// text is the old outstanding-count format. Hidden entirely when nothing
// urgent enough is outstanding, or when nothing is imminent.
function updatePriorityStrip() {
  const strip = document.getElementById("priority-strip");
  if (!strip) return;

  const pending = Object.values(tasks).filter(t => !t.completed);
  const emergCt = pending.filter(t => t.priority === "emergency").length;
  const urgCt   = pending.filter(t => t.priority === "urgent").length;

  // Nothing emerg/urgent outstanding → strip not relevant
  if (emergCt === 0 && urgCt === 0) {
    strip.className = "";
    strip.textContent = "";
    return;
  }

  // Outstanding exists, but show strip only if at least one pending
  // job is imminent (or overdue)
  const now = Date.now();
  const imminent = pending.some(t => t.remindAt && (t.remindAt - now) <= IMMINENT_MS);
  if (!imminent) {
    strip.className = "";
    return;
  }

  if (emergCt > 0) {
    strip.textContent = `!! ${emergCt} EMERGENCY JOB${emergCt > 1 ? "S" : ""} OUTSTANDING !!`;
    strip.className = "show emerg";
  } else {
    strip.textContent = `▲ ${urgCt} URGENT JOB${urgCt > 1 ? "S" : ""} OUTSTANDING`;
    strip.className = "show urg";
  }
}

// Re-check imminence on a timer so the flash kicks in without needing a data event.
setInterval(updatePriorityStrip, 30000);

// Retry pending writes periodically (covers cases where neither the online
// event nor a Firebase .info/connected change has prodded us)
setInterval(() => { if (getQueue().length) flushQueue(); }, 30000);

// ── Render ───────────────────────────────────────────────────
function render() {
  const tbody = document.getElementById("task-body");
  const empty = document.getElementById("empty");

  // Detect newly-added task IDs since last render (for pulse animation).
  // First render is initialisation — don't pulse everything that was already there.
  const currentIds = new Set(Object.keys(tasks));
  const newIds = knownTaskIds === null
    ? new Set()
    : new Set([...currentIds].filter(id => !knownTaskIds.has(id)));
  knownTaskIds = currentIds;

  // ALL outstanding emergencies are pinned at the top regardless of filters.
  // This is a safety property — you can't accidentally hide a live emergency.
  const allTasks = Object.entries(tasks).map(([id,t])=>({id,...t}));
  const pinned = allTasks
    .filter(t => t.priority === "emergency" && !t.completed)
    .sort((a,b) => (a.timeIn||"").localeCompare(b.timeIn||""));
  const pinnedIds = new Set(pinned.map(t => t.id));

  // Apply filters to the rest
  let arr = allTasks.filter(t => !pinnedIds.has(t.id));
  if (filterStatus==="active")    arr=arr.filter(t=>!t.completed);
  if (filterStatus==="completed") arr=arr.filter(t=> t.completed);
  if (filterPri!=="all")          arr=arr.filter(t=>t.priority===filterPri);
  if (filterType!=="all")         arr=arr.filter(t=>t.type===filterType);
  const search = document.getElementById("patient-search").value.trim().toUpperCase();
  if (search) arr = arr.filter(t => (t.patient||"").toUpperCase().includes(search));

  // Sort: emergency first, then urgent, then routine; within each by time
  arr.sort((a,b) => {
    const pd = (PRI_ORDER[a.priority]||2) - (PRI_ORDER[b.priority]||2);
    if (pd !== 0) return pd;
    return (a.timeIn||"").localeCompare(b.timeIn||"");
  });

  // Stats
  const all       = Object.values(tasks);
  const pending   = all.filter(t=>!t.completed);
  const emergCt   = pending.filter(t=>t.priority==="emergency").length;
  const urgCt     = pending.filter(t=>t.priority==="urgent").length;
  const doneCt    = all.filter(t=>t.completed).length;

  document.getElementById("stat-emerg").textContent = emergCt;
  document.getElementById("stat-urg").textContent   = urgCt;
  document.getElementById("stat-pend").textContent  = pending.length;
  document.getElementById("stat-done").textContent  = doneCt;
  document.getElementById("sb-pend").textContent    = pending.length;
  document.getElementById("sb-done").textContent    = doneCt;

  // Priority strip — see updatePriorityStrip() for flashing logic
  updatePriorityStrip();

  tbody.innerHTML = "";
  if (pinned.length === 0 && arr.length === 0) { empty.style.display = "block"; return; }
  empty.style.display = "none";

  // Build display groups
  const groups = [];
  if (pinned.length) {
    groups.push({ label:"EMERGENCY · PINNED", items: pinned });
  }
  if (filterStatus === "active") {
    const urg = arr.filter(t => t.priority === "urgent");
    const rou = arr.filter(t => t.priority === "routine");
    if (urg.length) groups.push({ label:"URGENT",  items: urg });
    if (rou.length) groups.push({ label:"ROUTINE", items: rou });
  } else if (arr.length) {
    groups.push({ label: null, items: arr });
  }

  groups.forEach(g => {
    if (g.label) {
      const sep = document.createElement("tr");
      sep.className = "tbl-section";
      sep.innerHTML = `<td colspan="7" data-count="${g.items.length}">${g.label}</td>`;
      tbody.appendChild(sep);
    }
    g.items.forEach(task => tbody.appendChild(buildRow(task, newIds.has(task.id))));
  });
}

function buildRow(task, isNew) {
  const t    = typeObj(task.type);
  const pri  = task.priority || "routine";

  const tr = document.createElement("tr");
  tr.className = `tbl-row p-${pri}${task.completed?" done":""}${isNew?" new-pulse":""}`;
  tr.id = "tr-"+task.id;

  tr.innerHTML = `
    <td class="td-cb">
      <button class="cb${task.completed?" checked":""}" onclick="toggleDone('${task.id}')">
        ${task.completed?"✓":""}
      </button>
    </td>
    <td class="td-pri">
      <span class="pri-badge pri-${pri}">${pri.toUpperCase()}</span>
    </td>
    <td class="td-patient">
      <div class="patient-str">${esc(task.patient||"?")}</div>
      ${(()=>{ const a = getAge(task); return a ? `<div style="font-size:9px;color:var(--amber4)">age ${a}</div>` : ""; })()}
      ${task.location?`<div style="font-size:9px;color:var(--amber4)">${esc(task.location)}</div>`:""}
      ${task.oncall?`<div style="font-size:9px;color:var(--amber4)">${esc(task.oncall)}</div>`:""}
    </td>

    <td class="td-type">
      <span class="type-pill" style="border-color:${t.color};color:${t.color}">${t.label}</span>
    </td>
    <td class="td-task" onclick="toggleExpand('${task.id}')">
      <div class="task-str">${esc(task.task||"")}</div>
      ${task.notes?`<div class="task-notes">// ${esc(task.notes)}</div>`:""}
    </td>
    <td class="td-time">
      ${task.remindAt?(()=>{
        const due = new Date(task.remindAt);
        const now = new Date();
        const overdue = !task.reminded && now > due;
        const hh = String(due.getHours()).padStart(2,"0");
        const mm = String(due.getMinutes()).padStart(2,"0");
        return `<div class="time-str" style="color:${overdue?'#ff4444':'var(--amber4)'}">DUE ${hh}:${mm}${overdue?'!!':''}</div>`;
      })():`<div class="time-str">${fmtTime(task.timeIn)}</div>`}
      
    </td>

    <td class="td-actions">
      ${!task.completed?`
        <button class="edt" onclick="openDrawer('${task.id}')">EDIT</button>
        <button class="dup" onclick="duplicateJob('${task.id}')">DUP</button>`:""}
      <button class="del" onclick="deleteJob('${task.id}')">✕</button>
    </td>`;
  return tr;
}

// Refresh time-ago every minute
setInterval(() => {
  Object.keys(tasks).forEach(id => {
    const el = document.getElementById("age-"+id);
    if (el && tasks[id]) el.textContent = timeAgo(tasks[id].timeIn);
  });
}, 60000);

// ── Controls ─────────────────────────────────────────────────
document.getElementById("status-filters").addEventListener("click", e => {
  if (!e.target.dataset.filter) return;
  filterStatus = e.target.dataset.filter;
  document.querySelectorAll(".cmd-btn[data-filter]").forEach(b =>
    b.classList.toggle("active", b.dataset.filter===filterStatus));
  render();
});
document.getElementById("pri-filter").addEventListener("change",  e=>{filterPri=e.target.value; render();});
document.getElementById("type-filter").addEventListener("change", e=>{filterType=e.target.value; render();});

window.addEventListener('keydown', (e) => {
  // Escape works even from inputs/textareas — it's how you bail out
  if (e.key === 'Escape') {
    if (document.getElementById('handover-overlay').classList.contains('show')) {
      e.preventDefault();
      closeHandover();
      return;
    }
    if (document.getElementById('add-drawer').classList.contains('open')) {
      e.preventDefault();
      closeDrawer();
      return;
    }
  }

  // Enter inside the drawer saves the job — except inside the textarea
  // (where Enter is the normal newline) and on buttons (where Enter clicks them)
  if (e.key === 'Enter'
      && document.getElementById('add-drawer').classList.contains('open')
      && e.target.tagName !== 'TEXTAREA'
      && e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    saveJob();
    return;
  }

  // The shortcuts below should NOT fire while typing in a field
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch (e.key.toLowerCase()) {
    case 'n':
      e.preventDefault();
      openDrawer();
      break;

    case 'h':
      e.preventDefault();
      openHandover();
      break;

    case 'e':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        clearShift();
      }
      break;

    case '/':
      e.preventDefault();
      document.getElementById('patient-search').focus(); 
      break;
  }
});
