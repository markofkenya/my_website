     entrustment, generic sign-off and the shop are written, in the ARCP app's own format. -->
<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    apiKey:"AIzaSyAhv0PJy95vqXdzOQkCqbg1FuXfiqHTnI0", authDomain:"task-monitor-bd7ee.firebaseapp.com",
    databaseURL:"https://task-monitor-bd7ee-default-rtdb.europe-west1.firebasedatabase.app", projectId:"task-monitor-bd7ee",
    storageBucket:"task-monitor-bd7ee.firebasestorage.app", messagingSenderId:"544624731364", appId:"1:544624731364:web:419d52fa061c5c7b4f38f1" });
  const db = getDatabase(app), dataRef = ref(db, "arcpData"), logbookRef = ref(db, "logbookData");
  window.QFB = { write: (key, val) => update(dataRef, { [key]: { value: String(val), ts: Date.now() } }) };
  signInAnonymously(getAuth(app)).catch(e => console.warn("auth", e)).finally(() => {
    onValue(dataRef,    s => window.dispatchEvent(new CustomEvent("q-data", { detail: s.val() || {} })), e => window.dispatchEvent(new CustomEvent("q-offline")));

<style>
/* Layout: one screen — HUD, world path, level grid for the chosen world, then rules + shop. Deliberate single dark arcade look. */
:root{
  color-scheme: dark;
  --night:#14112b; --panel:#211c45; --panel2:#2c2660; --ink:#f4f1ff; --mute:#a7a0d6;
  --coin:#ffc93c; --grass:#3fbf6a; --sky:#5cc8ff; --star:#ffe066; --lock:#5b5585; --alert:#ff6b6b; --brick:#c8673a; --edge:#0b0920;
  --pixel:'Silkscreen','Courier New',monospace; --body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
}
body.t-desert{--night:#2b1a12;--panel:#3d2618;--panel2:#523320;--brick:#d9a441}
body.t-night{--night:#06141c;--panel:#0c2430;--panel2:#123544;--brick:#2e6f8e}
body.t-snow{--night:#1a2238;--panel:#26324f;--panel2:#33426a;--brick:#cfe3ff}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* hidden overlays must never block taps */
html{background:var(--night)}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;border-radius:0}
button:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.box{background:var(--panel);border:3px solid var(--edge);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35);padding:12px}
h3{font-family:var(--pixel);font-size:13px;margin:0 0 10px;color:var(--coin);letter-spacing:.04em}
.note{font-size:12px;color:var(--mute)}
a{color:var(--sky)}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.who{display:flex;gap:12px;align-items:center;min-width:0}
canvas.av{width:60px;height:60px;image-rendering:pixelated;background:var(--panel2);border:3px solid var(--edge)}
.nm{font-family:var(--pixel);font-size:15px}
.ttl{color:var(--mute);font-size:13px}
.xp{height:10px;background:var(--edge);margin-top:6px;width:min(200px,38vw)}
.xp i{display:block;height:100%;background:var(--sky);transform-origin:left;transition:transform .35s steps(8)}
.stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.stat{text-align:center}
.stat > b{display:block;font-family:var(--pixel);font-size:19px;font-variant-numeric:tabular-nums}
.stat > span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.coin{display:inline-block;width:13px;height:13px;background:var(--coin);border:2px solid #8a5a00;border-radius:50%;vertical-align:-1px;margin-right:4px}
.hud .coin{animation:spin 1.2s steps(4) infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}
.side{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.sbtn{background:var(--panel2);border:3px solid var(--edge);padding:7px 10px;font-family:var(--pixel);font-size:10px;text-decoration:none;color:var(--ink);text-align:center}
.sync{font-size:11px;color:var(--mute);text-align:center}
.sync.ok{color:var(--grass)} .sync.bad{color:var(--alert)}

/* Path */
.path{overflow-x:auto;-webkit-overflow-scrolling:touch}
.track{display:flex;align-items:flex-end;min-width:660px;padding-top:58px}
.node{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;background:none;border:none;padding:0;text-align:center}
.plat{display:block;width:86%;height:20px;background:repeating-linear-gradient(90deg,var(--brick) 0 18px,rgba(0,0,0,.3) 18px 20px);border:3px solid var(--edge)}
.node.now .plat{background:repeating-linear-gradient(90deg,var(--grass) 0 18px,#2c8a4c 18px 20px)}
.node.done .plat{background:repeating-linear-gradient(90deg,var(--coin) 0 18px,#c99200 18px 20px)}
.node.view .lbl{color:var(--coin)}
.node.view .plat{outline:3px solid var(--coin);outline-offset:2px}
.lbl{font-family:var(--pixel);font-size:12px}
.sub{font-size:11px;color:var(--mute)}
.pct{font-family:var(--pixel);font-size:10px;color:var(--grass)}
canvas.walker{position:absolute;top:-50px;width:42px;height:42px;image-rendering:pixelated;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.castle{width:60px;height:60px;position:absolute;top:-58px}
.link{flex:0 0 14px;height:6px;margin-bottom:46px;background:repeating-linear-gradient(90deg,var(--mute) 0 6px,transparent 6px 10px)}

/* Levels */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--panel2);border:3px solid var(--edge);padding:7px 11px;font-family:var(--pixel);font-size:11px}
.tab[aria-selected="true"]{background:var(--sky);color:var(--night)}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.toggle input{width:20px;height:20px;accent-color:var(--coin)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:10px 0 12px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px;border:2px solid var(--edge)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lvl{position:relative;text-align:left;background:var(--panel2);border:3px solid var(--edge);padding:10px 10px 10px 54px;min-height:94px;display:flex;flex-direction:column;gap:5px}
.lvl:active{transform:translateY(1px)}
@media (hover:hover) and (pointer:fine){ .lvl:hover{filter:brightness(1.12)} }
.blk{position:absolute;left:8px;top:10px;width:36px;height:36px;display:grid;place-items:center;font-family:var(--pixel);font-size:11px;border:3px solid var(--edge);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.25)}
.lvl.locked .blk{background:var(--lock)} .lvl.prog .blk{background:var(--sky);color:var(--night)}
.lvl.clear .blk{background:var(--grass);color:var(--night)} .lvl.master .blk{background:var(--star);color:var(--night)}
.lnm{font-size:14px;line-height:1.25;font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.pips{display:flex;gap:3px} .pips i{width:12px;height:8px;background:var(--edge)} .pips i.on{background:var(--grass)}
.stars{font-size:14px;letter-spacing:1px;color:var(--lock);white-space:nowrap} .stars .on{color:var(--star)} .stars .tgt{color:var(--alert)}
.lvl.min{min-height:0;padding:6px 10px 6px 40px;opacity:.55} .lvl.min .blk{width:24px;height:24px;font-size:9px;top:5px;left:6px}
.lvl.min .meta{display:none} .lvl.min .lnm{font-size:12px;font-weight:400}

/* Drawer */
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--panel);border-top:4px solid var(--edge);padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:0 -10px 0 rgba(0,0,0,.3);-webkit-overflow-scrolling:touch}
.din{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.drawer h2{font-family:var(--pixel);font-size:15px;margin:0;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:3px solid var(--edge);padding:9px 11px;font-size:14px;display:flex;gap:8px;align-items:center}
.chip b{background:var(--coin);color:var(--night);font-family:var(--pixel);font-size:11px;padding:1px 6px}
.minus{font-family:var(--pixel);color:var(--mute);padding:2px 6px;border-left:2px solid var(--edge)}
.starbtns{display:flex;gap:6px}
.starbtns button{font-size:30px;background:none;border:none;color:var(--lock);padding:2px 4px}
.starbtns button.on{color:var(--star)}
.btn{background:var(--coin);color:var(--night);border:3px solid var(--edge);padding:8px 11px;font-family:var(--pixel);font-size:11px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.btn.alt{background:var(--panel2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Rules + shop */
.cols{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
.rules{width:100%;border-collapse:collapse;font-size:13px}
.rules td{padding:5px 4px;border-bottom:2px dotted rgba(167,160,214,.3)}
.rules td:last-child{text-align:right;font-family:var(--pixel);color:var(--coin);white-space:nowrap}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.item{background:var(--panel2);border:3px solid var(--edge);padding:9px;display:flex;flex-direction:column;gap:6px}
.item.eq{outline:3px solid var(--coin);outline-offset:-3px}
.cat{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.inm{font-weight:600}
.sw{display:block;height:14px;border:2px solid var(--edge)}
@media (max-width:760px){ .cols{grid-template-columns:1fr} .hud{grid-template-columns:1fr auto} .stats{grid-column:1/-1;justify-content:space-between} }

/* Welcome-back coin collection */
.collect{position:fixed;inset:0;z-index:60;background:rgba(11,9,32,.88);display:grid;place-items:center;padding:20px}
.cbox{background:var(--panel);border:4px solid var(--edge);box-shadow:inset -4px -4px 0 rgba(0,0,0,.35);padding:20px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.cbox .big{font-family:var(--pixel);font-size:40px;color:var(--coin);font-variant-numeric:tabular-nums}
.cbox ul{list-style:none;margin:0;padding:0;text-align:left;font-size:14px;display:grid;gap:4px}
.cbox li{display:flex;justify-content:space-between;border-bottom:2px dotted rgba(167,160,214,.3);padding:3px 0}
.cbox li b{font-family:var(--pixel);color:var(--coin);font-size:12px}

/* FX */
.pop{position:fixed;font-family:var(--pixel);font-size:17px;color:var(--coin);pointer-events:none;z-index:70;animation:popup .9s steps(9) forwards;text-shadow:2px 2px 0 var(--edge)}
@keyframes popup{to{transform:translateY(-60px);opacity:0}}
.banner{position:fixed;inset:0;display:grid;place-items:center;z-index:71;pointer-events:none}
.banner div{font-family:var(--pixel);font-size:clamp(32px,10vw,72px);color:var(--star);text-shadow:4px 4px 0 var(--edge),-2px -2px 0 var(--edge);animation:zoom 1.6s steps(12) forwards;text-align:center}
.banner small{display:block;font-size:clamp(12px,3vw,18px);color:var(--ink)}
@keyframes zoom{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.conf{position:fixed;width:8px;height:8px;z-index:70;pointer-events:none;animation:fall 1.4s linear forwards;will-change:transform}
@keyframes fall{to{transform:translateY(70vh) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

// ── Coins: derived from data every time + a breakdown (for the welcome-back screen) ──
function tally(){
  const t = { entries:{}, dops:0, evidence:0, clears:0, stars:0, sats:0, worlds:0 };
  Object.keys(LB_TYPES).forEach(k => { const a = lbEntries(k); t.entries[k] = a.length; if (k.startsWith("procedures")) t.dops += a.filter(e => e.dops === "Yes").length; });
  const cips = allCips();
  cips.forEach(x => { if (x.g.type === "level") t.stars += entrust(x.id); });
  YEARS.forEach(yr => { let c = 0; cips.forEach(x => { const n = count(x.id, yr); t.evidence += n; if (n >= EVID_TARGET){ t.clears++; c++; } if (x.g.type !== "level" && sat(x.id, yr)) t.sats++; }); if (c === cips.length) t.worlds++; });

  return t;
}

// ── Actions: change data, then celebrate by comparing before/after ──
function act(change){
  const yr = viewYear(), b = tally(), bState = {}; allCips().forEach(x => bState[x.id] = state(x, yr));
  change();
  const a = tally(), diff = a.coins - b.coins;
  renderHUD(a); renderStage(); renderShop(a); renderMap(); if (S.open && !$("drawer").hidden) openLevel(S.open);
  if (diff > 0){ pop("+" + diff); diff >= 5 ? SFX.big() : SFX.coin(); } else if (diff < 0) SFX.down();
  let delay = 200; const cips = allCips();
  const nowState = {}; cips.forEach(x => nowState[x.id] = state(x, yr));
  if (cips.some(x => bState[x.id] !== "master" && nowState[x.id] === "master")) { setTimeout(()=>{ SFX.clear(); banner("MASTERED!","Entrustment at target"); }, delay); delay += 1700; }
  else if (cips.some(x => ["locked","prog"].includes(bState[x.id]) && ["clear","master"].includes(nowState[x.id]))) { setTimeout(()=>{ SFX.clear(); banner("CLEAR!","+10 bonus"); }, delay); delay += 1700; }
  if (a.worlds > b.worlds) { setTimeout(()=>{ SFX.level(); banner("WORLD CLEAR!", `${yr} complete · +100`); }, delay); delay += 1700; }
  if (levelFor(a.coins) > levelFor(b.coins)) setTimeout(()=>{ SFX.level(); banner("LEVEL UP!", `Lv ${levelFor(a.coins)} · ${titleFor(levelFor(a.coins))}`); }, delay);
  local.set("seen", snapshotOf(a));
}

let pendingCollect = null;
function checkWelcome(){

  if (seen && t.coins <= seen.coins){ pendingCollect = false; local.set("seen", snapshotOf(t)); return; }

    const add = (lbl, cur, old, per) => { const d = cur - (old||0); if (d > 0) lines.push([`${d} × ${lbl}`, d*per]); };

    add("★ entrustment", t.stars, seen.stars, 15); add("Generic sign-off", t.sats, seen.sats, 30); add("WORLD CLEAR", t.worlds, seen.worlds, 100);
  }
  pendingCollect = { from: seen ? seen.coins : 0, to: t.coins, lines, first: !seen, t };
  const c = $("collect");
  c.innerHTML = `<div class="cbox"><div class="lbl" style="font-size:14px">${seen ? "WELCOME BACK, DR MAUGO" : "WELCOME TO ARCP QUEST"}</div>
    <div class="note">${seen ? "Coins earned in the ARCP app since your last visit" : "Your logbook and CiPs have already earned you coins"}</div>
    <ul>${lines.slice(0,8).map(([l,v])=>`<li><span>${esc(l)}</span><b>+${v}</b></li>`).join("")}</ul>
    <div class="big" id="cnum">+0</div>
    <button class="btn" data-act="collect">TAP TO COLLECT</button></div>`;
  c.hidden = false;
}
function runCollect(){
  const p = pendingCollect; if (!p) { $("collect").hidden = true; return; }
  unlockAudio(); const gain = p.to - p.from, steps = Math.min(24, Math.max(6, Math.ceil(gain/10))), btn = $("collect").querySelector("[data-act=collect]");
  btn.disabled = true; let i = 0;
  const iv = setInterval(() => { i++; $("cnum").textContent = "+" + Math.round(gain * i/steps).toLocaleString(); SFX.tick();
    if (i >= steps){ clearInterval(iv); SFX.big(); const before = levelFor(p.from), after = levelFor(p.to);
      setTimeout(() => { $("collect").hidden = true; renderAll(); if (after > before){ SFX.level(); banner("LEVEL UP!", `Lv ${after} · ${titleFor(after)}`); } }, 650);
      local.set("seen", snapshotOf(p.t)); pendingCollect = false; } }, 70);
}

// ── Sync wiring ──
window.addEventListener("q-data", e => { S.data = e.detail; S.gotData = true; local.set("cache_data", S.data); $("sync").textContent = "● live"; $("sync").className = "sync ok"; scheduleRender(); checkWelcome(); });
window.addEventListener("q-logbook", e => { S.lb = e.detail; S.gotLb = true; local.set("cache_lb", S.lb); scheduleRender(); checkWelcome(); });
window.addEventListener("q-offline", () => { $("sync").textContent = "● offline"; $("sync").className = "sync bad"; });
renderAll();   // instant first paint from the cached snapshot
</script>
</body>
</html>
