<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>SCE·NEP // Nephrology Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#080c14"/>
  <link rel="apple-touch-icon" href="sce-icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhv0PJy95vqXdzOQkCqbg1FuXfiqHTnI0",
      authDomain: "task-monitor-bd7ee.firebaseapp.com",
      databaseURL: "https://task-monitor-bd7ee-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "task-monitor-bd7ee",
      storageBucket: "task-monitor-bd7ee.firebasestorage.app",
      messagingSenderId: "544624731364",
      appId: "1:544624731364:web:419d52fa061c5c7b4f38f1",
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    const sceRef = ref(db, "sceData");

    window._sce_fb = { db, ref, update, set, onValue, sceRef };

    onValue(sceRef, snap => {
      window._sce_data = snap.val() || {};
      window.dispatchEvent(new CustomEvent("sce-sync"));
    });

    // Listen for custom KSAP and TOPICS overrides stored in Firebase
    const ksapRef   = ref(db, "sceConfig/ksap");
    const topicsRef = ref(db, "sceConfig/topics");
    const roadmapRef = ref(db, "sceConfig/roadmap");

    onValue(ksapRef, snap => {
      const val = snap.val();
      if (val && Array.isArray(val)) {
        window._sce_ksap = val;
        window.dispatchEvent(new CustomEvent("sce-config-sync"));
      }
    });

    onValue(topicsRef, snap => {
      const val = snap.val();
      if (val && typeof val === "object") {
        window._sce_topics = val;
        window.dispatchEvent(new CustomEvent("sce-config-sync"));
      }
    });

    onValue(roadmapRef, snap => {
      const val = snap.val();
      window._sce_roadmap = val && Array.isArray(val) ? val : null;
      window.dispatchEvent(new CustomEvent("sce-roadmap-sync"));
    });

    window._sce_fb.ksapRef   = ksapRef;
    window._sce_fb.topicsRef = topicsRef;
    window._sce_fb.roadmapRef = roadmapRef;
  </script>

  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#080c14; --bg2:#0e1420; --bg3:#141c2c; --bg4:#1a2438;
      --border:#1e2a3a; --border2:#263445;
      --white:#dde6f0; --grey:#6a7d92; --grey2:#3d5068;
      --green:#4ade80; --yellow:#fbbf24; --cyan:#22d3ee;
      --pink:#f472b6; --red:#f87171; --blue:#60a5fa;
      --orange:#fb923c; --purple:#a78bfa;
      --accent:#22d3ee;
      --font:'Fira Code',monospace;
    }
    html,body { background:var(--bg); color:var(--white); font-family:var(--font); font-size:12px; min-height:100vh; line-height:1.5; }
    ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:var(--bg2);} ::-webkit-scrollbar-thumb{background:var(--border2);}

    /* ── HEADER ── */
    #header { background:var(--bg2); border-bottom:1px solid var(--border2); }
    .hdr-top { display:flex; align-items:stretch; flex-wrap:wrap; }
    .hdr-logo { padding:12px 20px; border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:center; }
    .logo-main { font-size:16px; font-weight:600; color:var(--cyan); letter-spacing:0.04em; }
    .logo-main span { color:var(--grey); }
    .logo-sub { font-size:8px; color:var(--grey); letter-spacing:0.18em; margin-top:2px; }
    .hdr-stat { padding:10px 18px; border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:center; min-width:100px; }
    .stat-val { font-size:20px; font-weight:500; line-height:1; }
    .stat-key { font-size:8px; color:var(--grey); letter-spacing:0.12em; margin-top:3px; }
    .readiness-wrap { padding:10px 20px; display:flex; flex-direction:column; justify-content:center; flex:1; min-width:200px; }
    .readiness-label { font-size:8px; color:var(--grey); letter-spacing:0.15em; margin-bottom:6px; }
    .readiness-bar-bg { height:6px; background:var(--border2); overflow:hidden; }
    .readiness-bar { height:100%; transition:width 0.6s ease; }
    .readiness-pct { font-size:18px; font-weight:600; margin-top:4px; }
    .sync-wrap { padding:10px 16px; border-left:1px solid var(--border); display:flex; align-items:center; }
    .sync-dot { font-size:8px; color:var(--grey2); letter-spacing:0.08em; }

    /* ── TABBAR ── */
    #tabbar { background:var(--bg2); border-bottom:1px solid var(--border2); display:flex; overflow-x:auto; }
    .tab { padding:8px 18px; background:transparent; border:none; border-right:1px solid var(--border); border-bottom:2px solid transparent; color:var(--grey); font-family:var(--font); font-size:10px; cursor:pointer; letter-spacing:0.06em; white-space:nowrap; transition:all 0.1s; }
    .tab:hover { color:var(--white); background:var(--bg3); }
    .tab.active { color:var(--cyan); border-bottom-color:var(--cyan); background:var(--bg3); }
    .tab::before { content:"[ "; color:var(--grey2); }
    .tab::after { content:" ]"; color:var(--grey2); }

    /* ── SUBTAB (Pass 1 / Pass 2) ── */
    .subtab-row { display:flex; gap:0; background:var(--bg3); border-bottom:1px solid var(--border); padding:0 18px; }
    .subtab { padding:6px 14px; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--grey); font-family:var(--font); font-size:9px; cursor:pointer; letter-spacing:0.08em; }
    .subtab.active { color:var(--yellow); border-bottom-color:var(--yellow); }

    /* ── MAIN ── */
    #main { padding:14px 18px 80px; }

    /* ── CATEGORY CARDS ── */
    .cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:8px; margin-bottom:20px; }
    .cat-card { background:var(--bg2); border:1px solid var(--border2); border-left:3px solid var(--border2); padding:12px 14px; cursor:pointer; transition:all 0.1s; }
    .cat-card:hover { background:var(--bg3); }
    .cat-card.expanded { border-left-color:var(--cyan); }
    .cat-name { font-size:11px; font-weight:500; color:var(--white); margin-bottom:6px; }
    .cat-stats { display:flex; gap:12px; font-size:9px; color:var(--grey); margin-bottom:6px; }
    .cat-stat strong { color:var(--yellow); }
    .cat-bar-bg { height:3px; background:var(--border2); overflow:hidden; }
    .cat-bar { height:100%; background:var(--cyan); transition:width 0.4s; }

    /* ── QUESTION LIST ── */
    .q-list { background:var(--bg3); border:1px solid var(--border); border-top:none; padding:6px; display:flex; flex-direction:column; gap:6px; }
    .q-card { background:var(--bg2); border:1px solid var(--border2); border-left:3px solid var(--border2); padding:9px 11px; display:flex; flex-direction:column; gap:8px; transition:background 0.1s; }
    .q-card-top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .q-code { font-size:13px; font-weight:600; letter-spacing:0.04em; }
    .q-badges { display:flex; gap:5px; margin-left:auto; }
    .q-card-actions { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .q-btn { padding:7px 12px; border:1px solid var(--border2); background:transparent; color:var(--grey); font-family:var(--font); font-size:12px; cursor:pointer; transition:all 0.1s; border-radius:3px; }
    .q-btn.q-btn-icon { padding:7px 10px; font-size:13px; }
    .q-btn.correct { border-color:var(--green); color:var(--green); background:rgba(74,222,128,0.12); }
    .q-btn.incorrect { border-color:var(--red); color:var(--red); background:rgba(248,113,113,0.12); }
    .q-btn:hover:not(.correct):not(.incorrect):not(.flagged) { border-color:var(--cyan); color:var(--cyan); }
    .conf-dots { display:flex; gap:6px; padding:0 4px; }
    .conf-dot { width:15px; height:15px; border-radius:50%; border:1.5px solid var(--border2); background:transparent; cursor:pointer; transition:all 0.1s; }
    .conf-dot.lit { background:var(--yellow); border-color:var(--yellow); }
    .note-inp { background:var(--bg); border:1px solid var(--border2); color:var(--white); font-family:var(--font); font-size:12px; padding:7px 10px; width:100%; outline:none; border-radius:3px; }
    .note-inp:focus { border-color:var(--yellow); color:var(--white); }
    .note-inp::placeholder { color:var(--grey2); }
    .pass-badge { font-size:9px; padding:2px 6px; letter-spacing:0.06em; border:1px solid; border-radius:2px; }
    .pass-badge.p1 { color:var(--blue); border-color:rgba(96,165,250,0.3); }
    .pass-badge.p1done { color:var(--green); border-color:rgba(74,222,128,0.3); }
    .pass-badge.p2 { color:var(--purple); border-color:rgba(167,139,250,0.3); }
    .pass-badge.p2done { color:var(--orange); border-color:rgba(251,146,60,0.3); }

    /* ── TOPIC COVERAGE ── */
    .topic-section { margin-bottom:20px; }
    .topic-hdr { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bg2); border:1px solid var(--border2); cursor:pointer; }
    .topic-hdr:hover { background:var(--bg3); }
    .topic-hdr-name { font-size:11px; font-weight:500; color:var(--white); flex:1; }
    .topic-hdr-stats { font-size:9px; color:var(--grey); }
    .topic-hdr-pct { font-size:11px; font-weight:500; }
    .subtopic-list { background:var(--bg3); border:1px solid var(--border2); border-top:none; }
    .st-row { display:flex; align-items:center; gap:10px; padding:6px 14px; border-bottom:1px solid var(--border); font-size:10px; }
    .st-row:last-child { border-bottom:none; }
    .st-name { flex:1; color:var(--grey); }
    .st-name.read { color:var(--white); }
    .st-actions { display:flex; gap:6px; align-items:center; }
    .st-btn { padding:1px 7px; border:1px solid var(--border2); background:transparent; color:var(--grey2); font-family:var(--font); font-size:9px; cursor:pointer; }
    .st-btn.read { border-color:var(--green); color:var(--green); background:rgba(74,222,128,0.06); }
    .st-btn.reviewed { border-color:var(--cyan); color:var(--cyan); background:rgba(34,211,238,0.06); }

    /* ── SEC HEADS ── */
    .sec-head { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; padding:4px 0; border-bottom:1px solid var(--border); }
    .sec-title { font-size:10px; font-weight:500; color:var(--cyan); letter-spacing:0.08em; }
    .sec-rule { flex:1; }
    .sec-note { font-size:9px; color:var(--grey2); }
    .empty-msg { padding:30px 0; color:var(--grey2); font-size:10px; letter-spacing:0.08em; }
    .empty-msg::before { content:"> "; }

    /* ── OVERVIEW ── */
    .overview-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:6px; margin-bottom:20px; }
    .ov-card { background:var(--bg2); border:1px solid var(--border2); border-left:3px solid var(--border2); padding:10px 14px; }
    .ov-cat { font-size:10px; color:var(--white); font-weight:500; margin-bottom:6px; }
    .ov-row { display:flex; justify-content:space-between; font-size:9px; color:var(--grey); margin-bottom:3px; }
    .ov-row strong { color:var(--yellow); }
    .ov-bar-bg { height:2px; background:var(--border2); margin-top:6px; overflow:hidden; }
    .ov-bar { height:100%; }
    .conf-stack { display:flex; height:8px; margin-top:8px; border-radius:2px; overflow:hidden; background:var(--bg3); }
    .conf-seg { height:100%; transition:width 0.4s; }
    .conf-legend { display:flex; flex-wrap:wrap; gap:8px; font-size:8px; margin-top:5px; letter-spacing:0.04em; }

    /* ── STATUS BAR ── */
    #statusbar { position:fixed; bottom:0; left:0; right:0; background:var(--bg2); border-top:1px solid var(--border2); padding:5px 18px; display:flex; justify-content:space-between; align-items:center; font-size:9px; color:var(--grey2); z-index:100; }
    .sb-items { display:flex; gap:18px; flex-wrap:wrap; }
    .sb-item strong { color:var(--yellow); }

    @media(max-width:640px) {
      .cat-grid,.overview-grid { grid-template-columns:1fr; }
      #main { padding:10px 10px 80px; }
      .hdr-stat { min-width:80px; padding:8px 12px; }
    }
    .pass-badge.flagged { color:var(--pink); border-color:rgba(244,114,182,0.4); background:rgba(244,114,182,0.06); }
    .q-btn.flagged { border-color:var(--pink); color:var(--pink); background:rgba(244,114,182,0.08); }
    .filter-row { display:flex; gap:8px; align-items:center; padding:8px 18px; background:var(--bg2); border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .filter-btn { padding:2px 10px; border:1px solid var(--border2); background:transparent; color:var(--grey); font-family:var(--font); font-size:9px; cursor:pointer; transition:all 0.1s; letter-spacing:0.06em; }
    .filter-btn.active { border-color:var(--cyan); color:var(--cyan); background:rgba(34,211,238,0.06); }
    .filter-btn.flag-filter.active { border-color:var(--pink); color:var(--pink); background:rgba(244,114,182,0.06); }
    [id^="reassign-"] div:hover { background:var(--bg3) !important; color:var(--yellow) !important; }
    .admin-section { margin-bottom:28px; }
    .admin-inp { background:var(--bg); border:1px solid var(--border2); color:var(--white); font-family:var(--font); font-size:11px; padding:5px 8px; outline:none; caret-color:var(--cyan); transition:border-color 0.1s; }
    .admin-inp:focus { border-color:var(--yellow); }
    .admin-inp.wide { width:100%; }
    .admin-sel { background:var(--bg); border:1px solid var(--border2); color:var(--white); font-family:var(--font); font-size:11px; padding:5px 8px; outline:none; cursor:pointer; }
    .admin-sel option { background:var(--bg2); }
    .admin-btn { padding:4px 14px; border:1px solid var(--green); background:transparent; color:var(--green); font-family:var(--font); font-size:10px; cursor:pointer; letter-spacing:0.06em; transition:all 0.1s; }
    .admin-btn:hover { background:rgba(74,222,128,0.08); }
    .admin-btn.danger { border-color:var(--red); color:var(--red); }
    .admin-btn.danger:hover { background:rgba(248,113,113,0.08); }
    .admin-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
    .admin-tag { font-size:8px; color:var(--grey2); letter-spacing:0.1em; min-width:80px; }
    .q-admin-row { display:flex; align-items:center; gap:8px; padding:5px 10px; border-bottom:1px solid var(--border); font-size:10px; }
    .q-admin-row:hover { background:var(--bg3); }
    .st-admin-row { display:flex; align-items:center; gap:8px; padding:4px 10px; border-bottom:1px solid var(--border); font-size:10px; }
    .st-admin-row:hover { background:var(--bg3); }
    .err-row { background:var(--bg2); border:1px solid var(--border2); border-left:3px solid var(--red); margin-bottom:6px; }
    .err-header { display:flex; align-items:center; gap:10px; padding:8px 12px; }
    .err-code { font-size:9px; color:var(--cyan); min-width:90px; letter-spacing:0.04em; }
    .err-cat { font-size:9px; color:var(--grey); flex:1; }
    .err-conf { display:flex; gap:3px; }
    .err-note-wrap { padding:0 12px 10px; border-top:1px solid var(--border); }
    .err-note-text { font-size:10px; color:var(--white); padding:6px 0; line-height:1.5; font-style:italic; }
    .err-resolved { font-size:8px; padding:2px 8px; border:1px solid var(--grey2); background:transparent; color:var(--grey2); font-family:var(--font); cursor:pointer; letter-spacing:0.06em; }
    .err-resolved.done { border-color:var(--green); color:var(--green); background:rgba(74,222,128,0.06); }
    .err-filter-bar { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .err-del { font-size:9px; padding:2px 8px; border:1px solid var(--grey2); background:transparent; color:var(--grey2); font-family:var(--font); cursor:pointer; letter-spacing:0.06em; }
    .err-del:hover { border-color:var(--red); color:var(--red); background:rgba(248,113,113,0.08); }
    .print-only { display:none; }
    @media print {
      @page { margin:14mm; }
      html, body { background:#fff !important; color:#111 !important; font-size:11px; }
      #header, #tabbar, #statusbar, .no-print { display:none !important; }
      #main { padding:0 !important; }
      #tab-errorlog { display:block !important; }
      .print-only { display:block !important; }
      .err-row { border:1px solid #ccc !important; border-left:3px solid #c33 !important; background:#fff !important; opacity:1 !important; margin-bottom:6px; page-break-inside:avoid; }
      .err-header { padding:6px 10px; }
      .err-code, .err-cat { color:#222 !important; }
      .err-note-print { font-size:11px; color:#111 !important; padding:4px 10px 8px; line-height:1.5; }
      .err-cat-head { color:#111 !important; border-bottom:1px solid #999 !important; }
      .conf-dot { border:1px solid #888 !important; }
    }
  
    /* ── ROADMAP ── */
    .tab.roadmap-tab { color:var(--yellow); }
    .tab.roadmap-tab.active { color:var(--yellow); border-bottom-color:var(--yellow); background:rgba(251,191,36,0.06); }
    .rm-summary { background:var(--bg2); border:1px solid var(--border2); border-left:3px solid var(--cyan); padding:12px 16px; margin-bottom:20px; }
    .rm-timeline { position:relative; margin:16px 0; height:6px; background:var(--border2); border-radius:3px; overflow:hidden; }
    .rm-timeline-fill { height:100%; background:linear-gradient(90deg,var(--green),var(--cyan)); border-radius:3px; transition:width 0.5s; }
    .rm-block { background:var(--bg2); border:1px solid var(--border2); border-left:3px solid var(--border2); margin-bottom:10px; transition:opacity .15s, border-color .15s, box-shadow .15s; }
    .rm-block.active { border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan); }
    .rm-block.completed { opacity:0.55; }
    .rm-header { display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; }
    .rm-header:hover { background:var(--bg3); }
    .rm-cat { font-size:11px; font-weight:500; color:var(--white); flex:1; }
    .rm-dates { font-size:9px; color:var(--grey); white-space:nowrap; }
    .rm-badge { font-size:8px; padding:2px 8px; border:1px solid; letter-spacing:0.06em; white-space:nowrap; }
    .rm-badge.active { color:var(--cyan); border-color:var(--cyan); background:rgba(34,211,238,0.08); }
    .rm-badge.upcoming { color:var(--grey); border-color:var(--border2); }
    .rm-badge.completed { color:var(--green); border-color:var(--green); background:rgba(74,222,128,0.06); }
    .rm-body { padding:0 14px 14px; border-top:1px solid var(--border); }
    .rm-progress-bg { height:4px; background:var(--border2); margin:10px 0; overflow:hidden; }
    .rm-progress { height:100%; transition:width 0.4s; }
    .rm-edit-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
    .rm-inp { background:var(--bg); border:1px solid var(--border2); color:var(--white); font-family:var(--font); font-size:10px; padding:4px 8px; outline:none; }
    .rm-inp:focus { border-color:var(--yellow); }
    .rm-save-btn { padding:3px 12px; border:1px solid var(--green); background:transparent; color:var(--green); font-family:var(--font); font-size:9px; cursor:pointer; }
    .rm-mini-card { background:var(--bg); border:1px solid var(--border); padding:8px; }
    .rm-mini-label { font-size:8px; color:var(--grey); letter-spacing:0.1em; }
    .rm-mini-value { font-size:16px; font-weight:600; }
    @media(max-width:640px) {
      .rm-header { flex-wrap:wrap; gap:6px; }
      .rm-cat { width:calc(100% - 20px); }
      .rm-dates { width:100%; font-size:8px; }
      .rm-body [style*="grid-template-columns"], .rm-summary [style*="grid-template-columns"] { grid-template-columns:1fr !important; }
    }

  </style>

</head>
<body>

<div id="header">
  <div class="hdr-top">
    <div class="hdr-logo">
      <div class="logo-main">SCE<span>·</span>NEP</div>
      <div class="logo-sub">NEPHROLOGY TRACKER</div>
    </div>
    <div class="hdr-stat">
      <div class="stat-val" id="hdr-ksap-pct" style="color:var(--cyan)">0%</div>
      <div class="stat-key">KSAP CORRECT</div>
    </div>
    <div class="hdr-stat">
      <div class="stat-val" id="hdr-topic-pct" style="color:var(--green)">0%</div>
      <div class="stat-key">TOPICS COVERED</div>
    </div>
    <div class="hdr-stat">
      <div class="stat-val" id="hdr-attempted" style="color:var(--grey)">0</div>
      <div class="stat-key">KSAP ATTEMPTED</div>
    </div>
    <div class="readiness-wrap">
      <div class="readiness-label">SCE READINESS</div>
      <div class="readiness-bar-bg">
        <div class="readiness-bar" id="readiness-bar" style="width:0%"></div>
      </div>
      <div class="readiness-pct" id="readiness-pct">0%</div>
    </div>
    <div class="sync-wrap">
      <div class="sync-dot" id="sync-dot">● CONNECTING</div>
    </div>
  </div>

  if (n === null || n === undefined || isNaN(n)) return 0;

  if (pct >= 40) return "var(--yellow)";
  return "var(--red)";
}

// ══════════════════════════════════════════════════════════════════════
// COMPUTED STATS
// ══════════════════════════════════════════════════════════════════════
function computeStats() {
  let attempted = 0, correct = 0, p1done = 0, p2done = 0;
  KSAP.forEach(q => {
    const d = getQ(q.code);
    if (d.p1correct || d.p1incorrect) { attempted++; p1done++; }
    if (d.p2correct || d.p2incorrect) p2done++;
    if (d.p1correct) correct++;
  });
  const ksapPct = attempted > 0 ? Math.round(correct / attempted * 100) : 0;

  let stTotal = 0, stRead = 0;
  Object.entries(TOPICS).forEach(([cat, topics]) => {
    Object.entries(topics).forEach(([topic, subs]) => {
      subs.forEach(sub => {
        stTotal++;
        const d = getST(cat, topic, sub);
        if (d.read || d.reviewed) stRead++;
      });
    });
  });
  const topicPct = stTotal > 0 ? Math.round(stRead / stTotal * 100) : 0;

  // P1 score: performance × coverage × 40 weight
  const p1Attempted = p1done;
  const p1Correct   = KSAP.reduce((acc, q) => acc + (getQ(q.code).p1correct ? 1 : 0), 0);
  const p1Perf      = p1Attempted > 0 ? p1Correct / p1Attempted : 0;
  const p1Coverage  = p1Attempted / KSAP.length;
  const p1Score     = p1Perf * p1Coverage * 40;

  // P2 score: performance × coverage × 60 weight
  const p2Attempted = p2done;
  const p2Correct   = KSAP.reduce((acc, q) => acc + (getQ(q.code).p2correct ? 1 : 0), 0);
  const p2Perf      = p2Attempted > 0 ? p2Correct / p2Attempted : 0;
  const p2Coverage  = p2Attempted / KSAP.length;
  const p2Score     = p2Perf * p2Coverage * 60;

  const ksapReadiness = Math.min(100, Math.round(p1Score + p2Score));
  const readiness     = Math.round(ksapReadiness * 0.6 + topicPct * 0.4);
  return { attempted, correct, ksapPct, topicPct, readiness, p1done, p2done, stTotal, stRead };
}

function computeCatStats(cat) {
  const qs = KSAP.filter(q => {
    const d = getQ(q.code);
    return (d.reassignedCategory || q.category) === cat;
  });
  let attempted = 0, correct = 0, p1done = 0, p2done = 0, p2correct = 0;
  qs.forEach(q => {
    const d = getQ(q.code);
    if (d.p1correct || d.p1incorrect) { attempted++; p1done++; }
    if (d.p2correct || d.p2incorrect) p2done++;
    if (d.p1correct) correct++;
    if (d.p2correct) p2correct++;
  });
  return { total: qs.length, attempted, correct, p1done, p2done, p2correct,
    pct: attempted > 0 ? Math.round(correct/attempted*100) : 0,
    p2pct: p2done > 0 ? Math.round(p2correct/p2done*100) : 0 };
}

  const s = computeStats();
  const rPct = s.readiness;
  const rColor = rPct >= 70 ? "var(--green)" : rPct >= 40 ? "var(--yellow)" : "var(--red)";

  document.getElementById("hdr-ksap-pct").textContent = `${s.ksapPct}%`;
  document.getElementById("hdr-topic-pct").textContent = `${s.topicPct}%`;
  document.getElementById("hdr-attempted").textContent = s.attempted;
  document.getElementById("readiness-bar").style.width = `${rPct}%`;
  document.getElementById("readiness-bar").style.background = rColor;
  document.getElementById("readiness-pct").textContent = `${rPct}%`;
  document.getElementById("readiness-pct").style.color = rColor;
  document.getElementById("sb-p1").textContent = `${s.p1done}/${KSAP.length}`;
  document.getElementById("sb-p2").textContent = `${s.p2done}/${KSAP.length}`;

  renderTab(currentTab);
}

    <div class="sec-head">

                         cf.avg >= 2.5 ? "var(--green)" :
                         cf.avg >= 1.7 ? "var(--yellow)" : "var(--red)";

          <div class="ov-card" style="border-left-color:${color};cursor:pointer;" onclick="jumpToKsapCat('${cat.replace(/'/g,"\\'")}')">

              <span style="color:var(--red)">■ ${cf.c1} low</span>

// ── CONFIDENCE STATS HELPER ──────────────────────────────────────────
function computeCatConfidence(cat) {
  const qs = KSAP.filter(q => effectiveCat(q) === cat);
  let rated = 0, sum = 0, c1 = 0, c2 = 0, c3 = 0;
  qs.forEach(q => {
    const d = getQ(q.code);
    const c = d.confidence || 0;
    if (c >= 1) { rated++; sum += c; }
    if (c === 1) c1++; else if (c === 2) c2++; else if (c === 3) c3++;
  });
  return { total: qs.length, rated, avg: rated > 0 ? sum / rated : 0, c1, c2, c3 };
}

// ── CONFIDENCE TAB ────────────────────────────────────────────────────
let confFilter = "all";   // all | 1 | 2 | 3
let confStatusFilter = "all"; // all | correct | incorrect | unattempted
let confExpanded = new Set();

function renderConfidence() {
  const el = document.getElementById("tab-confidence");
  el.innerHTML = "";

  // Gather all rated questions
  const rated = KSAP
    .map(q => ({ q, d: getQ(q.code) }))
    .filter(({ d }) => (d.confidence || 0) >= 1);

  // Header + summary counts
  const total = KSAP.length;
  const ratedCount = rated.length;
  const c1 = rated.filter(({d}) => d.confidence === 1).length;
  const c2 = rated.filter(({d}) => d.confidence === 2).length;
  const c3 = rated.filter(({d}) => d.confidence === 3).length;

  const head = document.createElement("div");
  head.className = "sec-head";
  head.innerHTML = `<span class="sec-title">CONFIDENCE RATINGS</span><span class="sec-rule"></span><span class="sec-note">${ratedCount} of ${total} rated</span>`;
  el.appendChild(head);

  // Summary cards
  const summary = document.createElement("div");
  summary.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px;";
  summary.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--red);padding:10px 14px;">
      <div style="font-size:9px;color:var(--grey);letter-spacing:0.1em;">LOW (●)</div>
      <div style="font-size:20px;font-weight:500;color:var(--red)">${c1}</div>
      <div style="font-size:8px;color:var(--grey2);">shaky — priority</div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--yellow);padding:10px 14px;">
      <div style="font-size:9px;color:var(--grey);letter-spacing:0.1em;">MID (●●)</div>
      <div style="font-size:20px;font-weight:500;color:var(--yellow)">${c2}</div>
      <div style="font-size:8px;color:var(--grey2);">getting there</div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--green);padding:10px 14px;">
      <div style="font-size:9px;color:var(--grey);letter-spacing:0.1em;">HIGH (●●●)</div>
      <div style="font-size:20px;font-weight:500;color:var(--green)">${c3}</div>
      <div style="font-size:8px;color:var(--grey2);">solid</div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--cyan);padding:10px 14px;">
      <div style="font-size:9px;color:var(--grey);letter-spacing:0.1em;">UNRATED</div>
      <div style="font-size:20px;font-weight:500;color:var(--grey)">${total - ratedCount}</div>
      <div style="font-size:8px;color:var(--grey2);">no rating yet</div>
    </div>`;
  el.appendChild(summary);

  if (ratedCount === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = "no confidence ratings yet — set them via the dots in the KSAP Bank";
    el.appendChild(empty);
    return;
  }

  // Filter bar
  const bar = document.createElement("div");
  bar.className = "err-filter-bar";
  bar.innerHTML = `
    <span style="font-size:9px;color:var(--grey);letter-spacing:0.1em;">LEVEL:</span>
    <button class="filter-btn ${confFilter==='all'?'active':''}" onclick="confFilter='all';renderConfidence()">ALL</button>
    <button class="filter-btn ${confFilter==='1'?'active':''}" onclick="confFilter='1';renderConfidence()" style="${confFilter==='1'?'border-color:var(--red);color:var(--red);':''}">● LOW</button>
    <button class="filter-btn ${confFilter==='2'?'active':''}" onclick="confFilter='2';renderConfidence()" style="${confFilter==='2'?'border-color:var(--yellow);color:var(--yellow);':''}">●● MID</button>
    <button class="filter-btn ${confFilter==='3'?'active':''}" onclick="confFilter='3';renderConfidence()" style="${confFilter==='3'?'border-color:var(--green);color:var(--green);':''}">●●● HIGH</button>
    <span style="font-size:9px;color:var(--grey);letter-spacing:0.1em;margin-left:8px;">STATUS:</span>
    <button class="filter-btn ${confStatusFilter==='all'?'active':''}" onclick="confStatusFilter='all';renderConfidence()">ANY</button>
    <button class="filter-btn ${confStatusFilter==='correct'?'active':''}" onclick="confStatusFilter='correct';renderConfidence()">✓ CORRECT</button>
    <button class="filter-btn ${confStatusFilter==='incorrect'?'active':''}" onclick="confStatusFilter='incorrect';renderConfidence()">✗ INCORRECT</button>`;
  el.appendChild(bar);

  // Highlight callout for "correct but low confidence" — near-miss territory
  const nearMiss = rated.filter(({d}) =>
    d.confidence === 1 && (d.p1correct || d.p2correct)
  ).length;
  if (nearMiss > 0) {
    const nm = document.createElement("div");
    nm.style.cssText = "background:rgba(244,114,182,0.06);border:1px solid var(--pink);border-left:3px solid var(--pink);padding:9px 12px;margin-bottom:16px;font-size:10px;color:var(--white);";
    nm.innerHTML = `&#9888; <strong style="color:var(--pink)">${nearMiss}</strong> question${nearMiss>1?'s':''} you got <strong>correct but rated low confidence</strong> — classic near-miss, worth revisiting before they slip.`;
    el.appendChild(nm);
  }

  // Apply filters
  let filtered = rated.filter(({ d }) => {
    if (confFilter !== 'all' && d.confidence !== parseInt(confFilter)) return false;
    if (confStatusFilter === 'correct') return d.p1correct || d.p2correct;
    if (confStatusFilter === 'incorrect') return d.p1incorrect || d.p2incorrect;
    return true;
  });

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = "no questions match current filter";
    el.appendChild(empty);
    return;
  }

  // Group by category
  const byCat = {};
  filtered.forEach(({ q, d }) => {
    const ec = effectiveCat(q);
    if (!byCat[ec]) byCat[ec] = [];
    byCat[ec].push({ q, d });
  });

  Object.entries(byCat).sort().forEach(([cat, items]) => {
    const color = CAT_COLORS[cat] || "var(--cyan)";
    // sort within category: lowest confidence first
    items.sort((a,b) => (a.d.confidence||0) - (b.d.confidence||0));

    const catHead = document.createElement("div");
    catHead.style.cssText = `font-size:9px;color:${color};letter-spacing:0.12em;padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:6px;margin-top:10px;font-weight:500;cursor:pointer;`;
    catHead.innerHTML = `${cat} · ${items.length} <span style="color:var(--grey2);font-size:8px;">→ KSAP</span>`;
    catHead.onclick = () => jumpToKsapCat(cat);
    el.appendChild(catHead);

    items.forEach(({ q, d }) => {
      const conf = d.confidence || 0;
      const confColor = conf === 1 ? "var(--red)" : conf === 2 ? "var(--yellow)" : "var(--green)";
      const isCorrect = d.p1correct || d.p2correct;
      const isIncorrect = d.p1incorrect || d.p2incorrect;
      const statusBadge = isCorrect ? `<span style="font-size:8px;padding:1px 6px;border:1px solid var(--green);color:var(--green);">✓</span>` :
                          isIncorrect ? `<span style="font-size:8px;padding:1px 6px;border:1px solid var(--red);color:var(--red);">✗</span>` :
                          `<span style="font-size:8px;padding:1px 6px;border:1px solid var(--border2);color:var(--grey2);">·</span>`;
      const note = d.note ? `<span style="font-size:9px;color:var(--grey2);font-style:italic;margin-left:8px;">${escHtml(d.note)}</span>` : "";

      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--border);font-size:10px;";
      row.innerHTML = `
        <span style="display:flex;gap:3px;">
          ${[1,2,3].map(n => `<div style="width:8px;height:8px;border-radius:50%;border:1px solid ${conf>=n?confColor:'var(--border2)'};background:${conf>=n?confColor:'transparent'};"></div>`).join("")}
        </span>
        <span style="color:${color};min-width:90px;">${q.code}</span>
        ${statusBadge}
        ${note}
        <button class="filter-btn" style="font-size:8px;padding:1px 8px;margin-left:auto;"
          onclick="setTab('ksap');setKsapMode('category');expandedCats.clear();expandedCats.add('${cat.replace(/'/g,"\\'")}');renderKSAP();">→ KSAP</button>`;
      el.appendChild(row);
    });
  });
}

        if (ksapFilter === 'incorrect') return d.p1incorrect || d.p2incorrect;

            </div>
            <div class="cat-bar-bg"><div class="cat-bar" style="width:${Math.round(cs.p1done/cs.total*100)}%;background:${color}"></div></div>
          </div>

    MODULES.forEach(mod => {
      const allQs = KSAP.filter(q => q.module === mod)
        .slice().sort((a,b) => {
          const na = parseInt(a.code.split('-Q')[1]) || 0;
          const nb = parseInt(b.code.split('-Q')[1]) || 0;
          return na - nb;
        });
      const qs = allQs.filter(q => {
        const d = getQ(q.code);
        const attempted = d.p1correct || d.p1incorrect || d.p2correct || d.p2incorrect;
        if (ksapFilter === 'unattempted') return !attempted;
        if (ksapFilter === 'flagged') return d.flagged;

function qRow(q, pass) {
  const d = getQ(q.code);
  const p1c = d.p1correct, p1i = d.p1incorrect;
  const p2c = d.p2correct, p2i = d.p2incorrect;
  const conf = d.confidence || 0;
  const note = d.note || "";
  const ec = effectiveCat(q);
  const color = CAT_COLORS[ec] || "var(--cyan)";

  const p1badge = p1c ? `<span class="pass-badge p1done">P1✓</span>` :
                  p1i ? `<span class="pass-badge p1">P1✗</span>` :
                  `<span class="pass-badge" style="color:var(--grey2);border-color:var(--border2)">P1·</span>`;
  const p2badge = p2c ? `<span class="pass-badge p2done">P2✓</span>` :
                  p2i ? `<span class="pass-badge p2">P2✗</span>` :
                  `<span class="pass-badge" style="color:var(--grey2);border-color:var(--border2)">P2·</span>`;

  const isP1 = pass === "p1";
  const curCorrect = isP1 ? p1c : p2c;
  const curIncorrect = isP1 ? p1i : p2i;
  const correctField = isP1 ? "p1correct" : "p2correct";
  const incorrectField = isP1 ? "p1incorrect" : "p2incorrect";

  const flagged = d.flagged || false;
  const cats = [...new Set(KSAP.map(q => effectiveCat(q)))].sort();

  const isCorrect   = curCorrect;
  const isIncorrect = curIncorrect;
  const rowBg = flagged ? 'background:rgba(244,114,182,0.05);' : isCorrect ? 'background:rgba(74,222,128,0.05);' : isIncorrect ? 'background:rgba(248,113,113,0.05);' : '';
  const edge = flagged ? 'var(--pink)' : isCorrect ? 'var(--green)' : isIncorrect ? 'var(--red)' : color;
  return `<div class="q-card" style="${rowBg}border-left-color:${edge};">
    <div class="q-card-top">
      <span class="q-code" style="color:${color}">${q.code}</span>
      <span class="q-badges">${p1badge}${p2badge}${flagged?'<span class="pass-badge flagged">⚑</span>':''}</span>
    </div>
    <div class="q-card-actions">
      <button class="q-btn ${curCorrect?'correct':''}" onclick="toggleQ('${q.code}','${correctField}','${incorrectField}',${curCorrect||false})">✓ Correct</button>
      <button class="q-btn ${curIncorrect?'incorrect':''}" onclick="toggleQ('${q.code}','${incorrectField}','${correctField}',${curIncorrect||false})">✗ Wrong</button>
      <button class="q-btn q-btn-icon ${flagged?'flagged':''}" onclick="saveQ('${q.code}',{flagged:${!flagged}});renderKSAP();" title="Flag for review">⚑</button>
      <div class="conf-dots" title="Confidence">
        ${[1,2,3].map(n => `<div class="conf-dot ${conf>=n?'lit':''}" style="${conf>=n?`background:${conf===1?'var(--red)':conf===2?'var(--yellow)':'var(--green)'};border-color:${conf===1?'var(--red)':conf===2?'var(--yellow)':'var(--green)'};`:''}" onclick="setQConf('${q.code}',${n})"></div>`).join("")}
      </div>
      <div style="position:relative;display:inline-block;margin-left:auto;">
        <button class="q-btn q-btn-icon" onclick="toggleReassign('${q.code}')" title="Reassign category">✎</button>
        <div id="reassign-${q.code}" style="display:none;position:absolute;right:0;top:100%;z-index:200;background:var(--bg2);border:1px solid var(--yellow);min-width:240px;max-height:240px;overflow-y:auto;">
          ${cats.map(c => `<div style="padding:9px 12px;font-size:12px;cursor:pointer;color:${c===ec?'var(--yellow)':'var(--white)'};border-bottom:1px solid var(--border);"
            onmousedown="reassignQ('${q.code}','${c.replace(/'/g,"\\'")}');document.getElementById('reassign-${q.code}').style.display='none';renderKSAP();"
            >${c}</div>`).join('')}
        </div>
      </div>
    </div>
    <input class="note-inp" value="${escHtml(note)}" placeholder="why wrong / key learning point..."
      onchange="saveQ('${q.code}',{note:this.value})" />
  </div>`;
}

function toggleReassign(code) {
  const el = document.getElementById('reassign-' + code);
  if (!el) return;
  const isOpen = el.style.display !== 'none';
  document.querySelectorAll('[id^="reassign-"]').forEach(d => d.style.display = 'none');
  el.style.display = isOpen ? 'none' : 'block';
}

function setKsapFilter(f) {
  ksapFilter = f;
  renderKSAP();
}

function reassignQ(code, newCategory) {
  // Update in KSAP array in place
  const q = KSAP.find(q => q.code === code);
  if (q) q.category = newCategory;
  saveQ(code, { reassignedCategory: newCategory });
  // Persist the canonical category back to sceConfig/ksap so the change
  // sticks across refreshes (otherwise KSAP is rebuilt from Firebase with
  // the old category and the question reappears in its previous group).
  saveKsapToFirebase();
}

// Effective category: prefer the per-question override in sceData,
// falling back to the canonical q.category from sceConfig.
// This makes the KSAP list honour any historical reassignments that were
// only saved as overrides before reassignQ persisted to sceConfig.
function effectiveCat(q) {
  const d = getQ(q.code);
  return d.reassignedCategory || q.category;
}

function toggleQ(code, field, otherField, current) {
  const updates = { [field]: !current };
  if (!current) updates[otherField] = false; // untick the other
  saveQ(code, updates);
}

function setQConf(code, n) {
  const d = getQ(code);
  saveQ(code, { confidence: d.confidence === n ? 0 : n });
}

function toggleCat(cat) {
  if (expandedCats.has(cat)) expandedCats.delete(cat);
  else expandedCats.add(cat);
  renderKSAP();
}

function setKsapMode(mode) {
  ksapMode = mode;
  expandedCats.clear();
  renderKSAP();
}

// ── TOPICS ────────────────────────────────────────────────────────────
function renderTopics() {

    html += `
      <div class="topic-section">
        <div class="topic-hdr" style="border-left:3px solid ${color}" onclick="toggleTopicCat('${escAttr(cat)}')">
          <div class="topic-hdr-name">${cat}</div>
          <div class="topic-hdr-stats">${catRead}/${catTotal} subtopics</div>
          <div class="topic-hdr-pct" style="color:${color};margin-left:12px;">${Math.round(catRead/catTotal*100)}%</div>
        </div>`;

    if (expandedTopics.has(cat)) {
      Object.entries(topicsObj).forEach(([topic, subs]) => {
        let topicRead = 0;
        subs.forEach(sub => { const d = getST(cat, topic, sub); if (d.read || d.reviewed) topicRead++; });

        html += `
          <div style="background:var(--bg2);border:1px solid var(--border2);border-top:none;padding:6px 14px;font-size:9px;color:var(--cyan);letter-spacing:0.1em;">
            ${topic} · <span style="color:var(--grey2)">${topicRead}/${subs.length}</span>
          </div>
          <div class="subtopic-list">
            ${subs.map(sub => {
              const d = getST(cat, topic, sub);
              const k = `'${escAttr(cat)}','${escAttr(topic)}','${escAttr(sub)}'`;
              return `<div class="st-row">
                <div class="st-name ${d.read||d.reviewed?'read':''}">${sub}</div>
                <div class="st-actions">
                  <button class="st-btn ${d.read?'read':''}" onclick="toggleST(${k},'read')">READ</button>
                  <button class="st-btn ${d.reviewed?'reviewed':''}" onclick="toggleST(${k},'reviewed')">REVIEWED</button>
                </div>
              </div>`;
            }).join("")}
          </div>`;
      });
    }

    html += `</div>`;
  });

  el.innerHTML = html;
}

function toggleTopicCat(cat) {
  if (expandedTopics.has(cat)) expandedTopics.delete(cat);
  else expandedTopics.add(cat);
  renderTopics();
}

function toggleST(cat, topic, sub, field) {
  const d = getST(cat, topic, sub);
  saveST(cat, topic, sub, { [field]: !d[field] });
}

function escHtml(t) {
  return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escAttr(t) {
  return String(t||"").replace(/'/g,"\\'");
}

function saveKsapToFirebase() {
  if (!window._sce_fb) return;
  const { db, ref, set } = window._sce_fb;
  set(ref(db, "sceConfig/ksap"), KSAP);
}

function saveTopicsToFirebase() {
  if (!window._sce_fb) return;
  const { db, ref, set } = window._sce_fb;
  set(ref(db, "sceConfig/topics"), TOPICS);
}

// ERROR LOG
// ══════════════════════════════════════════════════════════════════════
let errFilter = "all"; // "all" | "flagged" | "unresolved" | "studyprn" | "ksap"
let errSort   = "cat"; // "cat" | "conf"

function renderErrorLog() {
  const el = document.getElementById("tab-errorlog");
  el.innerHTML = "";

  // KSAP-based entries (have a note)
  const ksapEntries = KSAP
    .map(q => ({ q, d: getQ(q.code), source: "ksap" }))
    .filter(({ d }) => d.note && d.note.trim().length > 0);

  // StudyPRN entries (free-form, no question code)
  const spObj = getStudyPRN();
  const spEntries = Object.entries(spObj)
    .filter(([id, v]) => v && v.note && v.note.trim().length > 0)
    .map(([id, v]) => ({ id, sp: v, source: "studyprn" }));

  const allEntries = [...ksapEntries, ...spEntries];
  const totalCount = allEntries.length;
  const unresolvedCount = ksapEntries.filter(({d})=>!d.resolved).length
    + spEntries.filter(({sp})=>!sp.resolved).length;

  // Header
  const headDiv = document.createElement("div");
  headDiv.className = "sec-head no-print";
  headDiv.innerHTML = `<span class="sec-title" style="color:var(--red)">ERROR LOG</span><span class="sec-rule"></span><span class="sec-note">${totalCount} entries · ${unresolvedCount} unresolved</span>`;
  el.appendChild(headDiv);

  // ADD STUDYPRN ERROR FORM
  const addForm = document.createElement("div");
  addForm.className = "no-print";
  addForm.style.cssText = "background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--yellow);padding:12px 14px;margin-bottom:16px;";
  addForm.innerHTML = `
    <div style="font-size:9px;color:var(--yellow);letter-spacing:0.1em;margin-bottom:8px;font-weight:500;">+ ADD STUDYPRN ERROR <span style="color:var(--grey2);font-weight:400;">(no question code needed)</span></div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <select class="admin-sel" id="sp-cat" style="width:100%;max-width:380px;">
        ${[...new Set(KSAP.map(q=>effectiveCat(q)))].sort().map(c=>`<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join("")}
      </select>
      <textarea id="sp-note" placeholder="What was the error / what did you learn? (mechanism, not just the fact)" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--white);font-family:var(--font);font-size:11px;padding:8px;outline:none;min-height:54px;resize:vertical;"></textarea>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:9px;color:var(--grey2);">Confidence:</span>
        <div class="conf-dots" id="sp-conf-dots">
          ${[1,2,3].map(n=>`<div class="conf-dot" data-n="${n}" onclick="spSetConf(${n})" style="width:11px;height:11px;"></div>`).join("")}
        </div>
        <button class="admin-btn" style="margin-left:auto;" onclick="addStudyPRNError()">ADD ENTRY ▸</button>
      </div>
    </div>`;
  el.appendChild(addForm);

  if (totalCount === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = "no errors logged yet — add 'why wrong' notes in the KSAP bank, or a StudyPRN error above";
    el.appendChild(empty);
    return;
  }

  // FILTER + SORT + PRINT BAR
  const barDiv = document.createElement("div");
  barDiv.className = "err-filter-bar no-print";
  barDiv.innerHTML = `
    <span style="font-size:9px;color:var(--grey);letter-spacing:0.1em;">FILTER:</span>
    <button class="filter-btn ${errFilter==='all'?'active':''}" onclick="errFilter='all';renderErrorLog()">ALL (${totalCount})</button>
    <button class="filter-btn ${errFilter==='unresolved'?'active':''}" onclick="errFilter='unresolved';renderErrorLog()">UNRESOLVED (${unresolvedCount})</button>
    <button class="filter-btn flag-filter ${errFilter==='flagged'?'active':''}" onclick="errFilter='flagged';renderErrorLog()">⚑ FLAGGED (${ksapEntries.filter(({d})=>d.flagged).length})</button>
    <button class="filter-btn ${errFilter==='ksap'?'active':''}" onclick="errFilter='ksap';renderErrorLog()">KSAP (${ksapEntries.length})</button>
    <button class="filter-btn ${errFilter==='studyprn'?'active':''}" onclick="errFilter='studyprn';renderErrorLog()">STUDYPRN (${spEntries.length})</button>
    <span style="font-size:9px;color:var(--grey);letter-spacing:0.1em;margin-left:8px;">SORT:</span>
    <button class="filter-btn ${errSort==='cat'?'active':''}" onclick="errSort='cat';renderErrorLog()">BY CATEGORY</button>
    <button class="filter-btn ${errSort==='conf'?'active':''}" onclick="errSort='conf';renderErrorLog()">BY CONFIDENCE ↑</button>
    <button class="filter-btn" style="margin-left:auto;border-color:var(--cyan);color:var(--cyan);" onclick="window.print()">⎙ PRINT</button>`;
  el.appendChild(barDiv);

  // Print-only title
  const printTitle = document.createElement("div");
  printTitle.className = "print-only";
  printTitle.innerHTML = `<h1 style="font-size:16px;margin-bottom:2px;">SCE Nephrology — Error Log</h1><div style="font-size:10px;color:#555;margin-bottom:12px;">${totalCount} entries · ${unresolvedCount} unresolved · printed ${new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"})}</div>`;
  el.appendChild(printTitle);

  // Normalize to common shape
  const norm = allEntries.map(e => {
    if (e.source === "ksap") {
      return { source:"ksap", q:e.q, d:e.d, cat:effectiveCat(e.q),
               note:e.d.note, conf:e.d.confidence||0, resolved:!!e.d.resolved, flagged:!!e.d.flagged };
    }
    return { source:"studyprn", id:e.id, sp:e.sp, cat:e.sp.category||"(uncategorised)",
             note:e.sp.note, conf:e.sp.confidence||0, resolved:!!e.sp.resolved, flagged:false };
  });

  // Filter
  let filtered = norm.filter(e => {
    if (errFilter === "flagged")    return e.flagged;
    if (errFilter === "unresolved") return !e.resolved;
    if (errFilter === "ksap")       return e.source === "ksap";
    if (errFilter === "studyprn")   return e.source === "studyprn";
    return true;
  });

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-msg no-print";
    empty.textContent = "no entries match current filter";
    el.appendChild(empty);
    return;
  }

  // Sort
  filtered.sort((a,b) => errSort === "conf" ? (a.conf - b.conf) : a.cat.localeCompare(b.cat));

  if (errSort === "cat") {
    const byCat = {};
    filtered.forEach(e => { (byCat[e.cat] ||= []).push(e); });
    Object.entries(byCat).forEach(([cat, items]) => {
      const color = CAT_COLORS[cat] || "var(--cyan)";
      const catHead = document.createElement("div");
      catHead.className = "err-cat-head";
      catHead.style.cssText = `font-size:9px;color:${color};letter-spacing:0.12em;padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:8px;font-weight:500;`;
      catHead.textContent = `${cat} · ${items.length} error${items.length>1?'s':''}`;
      el.appendChild(catHead);
      items.forEach(e => el.appendChild(makeErrRow(e)));
    });
  } else {
    filtered.forEach(e => el.appendChild(makeErrRow(e)));
  }
}

let _spConf = 0;
function spSetConf(n) {
  _spConf = (_spConf === n) ? 0 : n;
  document.querySelectorAll('#sp-conf-dots .conf-dot').forEach(dot => {
    const dn = parseInt(dot.dataset.n);
    const lit = dn <= _spConf;
    const col = _spConf===1?'var(--red)':_spConf===2?'var(--yellow)':'var(--green)';
    dot.style.background = lit ? col : 'transparent';
    dot.style.borderColor = lit ? col : 'var(--border2)';
  });
}
function addStudyPRNError() {
  const cat = document.getElementById("sp-cat")?.value;
  const note = document.getElementById("sp-note")?.value.trim();
  if (!note) { alert("Please write a note for the error."); return; }
  const id = newStudyPRNId();
  const entry = { category: cat, note, confidence: _spConf, resolved: false, ts: Date.now() };
  saveStudyPRN(id, entry);
  if (!sceData.studyprn) sceData.studyprn = {};
  sceData.studyprn[id] = entry;
  _spConf = 0;
  renderErrorLog();
}

function makeErrRow(e) {
  const color    = CAT_COLORS[e.cat] || "var(--cyan)";
  const conf     = e.conf;
  const resolved = e.resolved;
  const flagged  = e.flagged;
  const isSP     = e.source === "studyprn";

  const row = document.createElement("div");
  row.className = "err-row";
  row.style.borderLeftColor = resolved ? "var(--green)" : flagged ? "var(--pink)" : isSP ? "var(--yellow)" : "var(--red)";
  row.style.opacity = resolved ? "0.55" : "1";

  const codeLabel = isSP
    ? `<span class="err-code" style="color:var(--yellow)">STUDYPRN</span>`
    : `<span class="err-code" style="color:${color}">${e.q.code}</span>`;
  const moduleLabel = isSP ? "" : `<span style="font-size:8px;color:var(--grey2);">${e.q.module}</span>`;

  const confDots = `<div class="err-conf">
      ${[1,2,3].map(n => `<div class="conf-dot ${conf>=n?'lit':''}" style="pointer-events:none;${conf>=n?`background:${conf===1?'var(--red)':conf===2?'var(--yellow)':'var(--green)'};border-color:${conf===1?'var(--red)':conf===2?'var(--yellow)':'var(--green)'};`:''}"></div>`).join("")}
    </div>`;

  const resolveHandler = isSP
    ? `saveStudyPRN('${e.id}',{resolved:${!resolved}});if(sceData.studyprn&&sceData.studyprn['${e.id}'])sceData.studyprn['${e.id}'].resolved=${!resolved};renderErrorLog();`
    : `saveQ('${e.q.code}',{resolved:${!resolved}});renderErrorLog();`;

  const deleteHandler = isSP
    ? `if(confirm('Delete this StudyPRN error?')){deleteStudyPRN('${e.id}');if(sceData.studyprn)delete sceData.studyprn['${e.id}'];renderErrorLog();}`
    : `if(confirm('Delete this error note? (the question and your answer stay; only the note is removed)')){saveQ('${e.q.code}',{note:null});renderErrorLog();}`;

  const jumpBtn = isSP ? "" : `<button class="filter-btn no-print" style="font-size:8px;padding:1px 8px;" onclick="jumpToKsapCat('${e.cat.replace(/'/g,"\\'")}')">→ KSAP</button>`;

  const noteEditHandler = isSP
    ? `saveStudyPRN('${e.id}',{note:this.value});if(sceData.studyprn&&sceData.studyprn['${e.id}'])sceData.studyprn['${e.id}'].note=this.value;`
    : `saveQ('${e.q.code}',{note:this.value});`;

  row.innerHTML = `
    <div class="err-header">
      ${codeLabel}
      <span class="err-cat">${e.cat}</span>
      ${moduleLabel}
      ${confDots}
      ${flagged ? '<span class="pass-badge flagged">⚑</span>' : ""}
      <button class="err-resolved ${resolved?'done':''} no-print" onclick="${resolveHandler}">
        ${resolved ? "✓ RESOLVED" : "MARK RESOLVED"}
      </button>
      ${jumpBtn}
      <button class="err-del no-print" title="Delete entry" onclick="${deleteHandler}">✕</button>
    </div>
    <div class="err-note-wrap">
      <div class="err-note-print print-only">${escHtml(e.note)}</div>
      <div class="err-note-text no-print">"${escHtml(e.note)}"</div>
      <input class="note-inp no-print" style="width:100%;margin-top:4px;" value="${escHtml(e.note)}" placeholder="edit note..."
        onchange="${noteEditHandler}renderErrorLog();" />
    </div>`;
  return row;
}

function clearAllProgress() {
  if (!confirm("⚠️ WARNING: This will delete ALL your KSAP and topic progress.\n\nAre you absolutely sure?")) return;
  if (!confirm("⚠️ SECOND WARNING: This cannot be undone. All answers, flags, notes and topic coverage will be permanently deleted.\n\nConfirm to proceed.")) return;
  if (!window._sce_fb) return;
