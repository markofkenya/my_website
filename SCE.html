// ══════════════════════════════════════════════════════════════════════
// ROADMAP — EXPECTED VS ACTUAL STUDY PLAN
// ══════════════════════════════════════════════════════════════════════
const ROADMAP_DEFAULTS = [
  { cat: "Acute Kidney Injury and ICU Nephrology", days: 28 },
  { cat: "Chronic Kidney Disease", days: 42 },
  { cat: "Glomerular and Vascular Disorders", days: 28 },
  { cat: "Acid–Base and Potassium Disorders", days: 21 },
  { cat: "Sodium and Water Abnormalities", days: 21 },
  { cat: "Kidney Transplantation", days: 21 },
  { cat: "Hypertension", days: 21 },
  { cat: "Calcium, Phosphorus, and Magnesium Disorders and Stones", days: 14 },
  { cat: "Tubular, Interstitial, and Cystic Disorders", days: 14 },
  { cat: "Pharmacology", days: 14 },
];

// Backward-compat: derive a block's duration in days whether it stores
// `days` (new) or `months` (legacy saved roadmaps in Firebase).
function blockDays(b) {
  if (b.days != null) return b.days;
  if (b.months != null) return Math.round(b.months * 30);
  // fall back to computing from start/end
  if (b.start && b.end) {
    return Math.round((new Date(b.end) - new Date(b.start)) / 86400000) + 1;
  }
  return 14;
}

function buildDefaultRoadmap() {
  const start = new Date("2026-04-01");
  return ROADMAP_DEFAULTS.map(d => {
    const end = new Date(start.getTime() + (d.days - 1) * 86400000);
    const block = {
      cat: d.cat,
      days: d.days,
      start: start.toISOString().split("T")[0],
      end: end.toISOString().split("T")[0],
    };
    start.setTime(start.getTime() + d.days * 86400000);
    return block;
  });
}

function cascadeRoadmap(blocks, fromIndex) {
  for (let i = fromIndex + 1; i < blocks.length; i++) {
    const prevEnd = new Date(blocks[i-1].end);
    const next = new Date(prevEnd.getTime() + 86400000);
    blocks[i].start = next.toISOString().split("T")[0];
    const d = blockDays(blocks[i]);
    const end = new Date(next.getTime() + (d - 1) * 86400000);
    blocks[i].end = end.toISOString().split("T")[0];
  }
  return blocks;
}

function saveRoadmap() {
  if (!window._sce_fb || !roadmapData) return;
  const { db, ref, set } = window._sce_fb;
  set(ref(db, "sceConfig/roadmap"), roadmapData);
}

function catTopicPct(cat) {
  const canonicalCat = normCat(cat);
  const topicsObj = TOPICS[canonicalCat];
  if (!topicsObj) return null;
  let total = 0, read = 0;
  Object.entries(topicsObj).forEach(([topic, subs]) => {
    subs.forEach(sub => {
      total++;
      const d = getST(canonicalCat, topic, sub);
      if (d.read || d.reviewed) read++;
    });
  });
  return total > 0 ? Math.round(read / total * 100) : 0;
}

function catKsapPct(cat) {
  const canonicalCat = normCat(cat);
  const qs = KSAP.filter(q => normCat(q.category) === canonicalCat || q.category === cat);
  if (!qs.length) return null;
  const attempted = qs.filter(q => {
    const d = getQ(q.code);
    return d.p1correct || d.p1incorrect;
  }).length;
  return Math.round(attempted / qs.length * 100);
}

function catKsapAccuracyPct(cat) {
  const canonicalCat = normCat(cat);
  const qs = KSAP.filter(q => normCat(q.category) === canonicalCat || q.category === cat);
  let attempted = 0, correct = 0;
  qs.forEach(q => {
    const d = getQ(q.code);
    if (d.p1correct || d.p1incorrect) attempted++;
    if (d.p1correct) correct++;
  });
  return attempted > 0 ? Math.round(correct / attempted * 100) : null;
}

function actualBlockProgress(cat) {
  const topic = catTopicPct(cat);
  const ksap = catKsapPct(cat);
  if (topic === null && ksap === null) return 0;
  if (topic === null) return ksap;
  if (ksap === null) return topic;
  return Math.round((topic + ksap) / 2);
}

function expectedBlockProgress(block, today = new Date()) {
  const start = new Date(block.start);
  const end = new Date(block.end);
  start.setHours(0,0,0,0);
  end.setHours(0,0,0,0);
  today.setHours(0,0,0,0);
  if (today < start) return 0;
  if (today > end) return 100;
  const totalDays = Math.max(1, Math.round((end - start) / 86400000) + 1);
  const elapsedDays = Math.max(0, Math.round((today - start) / 86400000) + 1);
  return clampPct((elapsedDays / totalDays) * 100);
}

function progressStatus(actual, expected) {
  const delta = actual - expected;
  if (delta >= 10) return { label:"AHEAD", color:"var(--green)", bg:"rgba(74,222,128,0.08)", delta };
  if (delta >= -10) return { label:"ON TRACK", color:"var(--cyan)", bg:"rgba(34,211,238,0.08)", delta };
  if (delta >= -25) return { label:"DRIFTING", color:"var(--yellow)", bg:"rgba(251,191,36,0.08)", delta };
  return { label:"BEHIND", color:"var(--red)", bg:"rgba(248,113,113,0.08)", delta };
}

function getActiveRoadmapIndex() {
  if (!Array.isArray(roadmapData) || roadmapData.length === 0) return -1;
  const today = new Date();
  today.setHours(0,0,0,0);
  let currentIdx = -1;
  roadmapData.forEach((b, i) => {
    const s = new Date(b.start);
    const e = new Date(b.end);
    s.setHours(0,0,0,0);
    e.setHours(0,0,0,0);
    if (today >= s && today <= e) currentIdx = i;
  });
  if (currentIdx === -1 && today < new Date(roadmapData[0].start)) currentIdx = 0;
  return currentIdx;
}

function renderRoadmap() {
  const el = document.getElementById("tab-roadmap");
  if (!el) return;

  if (!Array.isArray(roadmapData) || roadmapData.length === 0) {
    roadmapData = buildDefaultRoadmap();
  }

  el.innerHTML = "";

  const today = new Date();
  today.setHours(0,0,0,0);

  const currentIdx = getActiveRoadmapIndex();
  const activeBlock = roadmapData[currentIdx];

  const finalBlock = roadmapData[roadmapData.length - 1];
  if (!finalBlock || !finalBlock.end) {
    roadmapData = buildDefaultRoadmap();
    return renderRoadmap();
  }

  const finalEnd = new Date(finalBlock.end);
  const totalDays = Math.max(1, Math.round((finalEnd - new Date(roadmapData[0].start)) / 86400000));
  const elapsed = Math.max(0, Math.round((today - new Date(roadmapData[0].start)) / 86400000));
  const pct = clampPct(elapsed / totalDays * 100);
  const daysLeft = Math.max(0, Math.round((finalEnd - today) / 86400000));

  if (activeBlock) {
    const activeActual = actualBlockProgress(activeBlock.cat);
    const activeExpected = expectedBlockProgress(activeBlock, new Date());
    const activeStatus = progressStatus(activeActual, activeExpected);
    const activeEnd = new Date(activeBlock.end);
    const activeDaysLeft = Math.max(0, Math.round((activeEnd - today) / 86400000));

    const hero = document.createElement("div");
    hero.className = "rm-summary";
    hero.style.borderLeftColor = activeStatus.color;
    hero.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
        <div>
          <div style="font-size:8px;color:var(--grey);letter-spacing:0.14em;margin-bottom:4px;">ACTIVE NOW</div>
          <div style="font-size:16px;color:var(--white);font-weight:600;line-height:1.3;">${activeBlock.cat}</div>
          <div style="font-size:9px;color:var(--grey);margin-top:4px;">
            ${activeDaysLeft}d left · ${new Date(activeBlock.start).toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}
            → ${activeEnd.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
          </div>
        </div>
        <div style="text-align:right;">
          <div style="display:inline-block;font-size:9px;padding:3px 9px;border:1px solid ${activeStatus.color};color:${activeStatus.color};background:${activeStatus.bg};letter-spacing:0.08em;">${activeStatus.label}</div>
          <div style="font-size:9px;color:var(--grey2);margin-top:5px;">${activeStatus.delta >= 0 ? "+" : ""}${activeStatus.delta}% vs expected</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;">
        <div>
          <div style="font-size:8px;color:var(--grey);letter-spacing:0.1em;margin-bottom:4px;">EXPECTED BY TODAY</div>
          <div class="rm-progress-bg"><div class="rm-progress" style="width:${activeExpected}%;background:var(--grey);"></div></div>
          <div style="font-size:11px;color:var(--grey);margin-top:3px;">${activeExpected}%</div>
        </div>
        <div>
          <div style="font-size:8px;color:var(--grey);letter-spacing:0.1em;margin-bottom:4px;">ACTUAL COMPLETION</div>
          <div class="rm-progress-bg"><div class="rm-progress" style="width:${activeActual}%;background:${activeStatus.color};"></div></div>
          <div style="font-size:11px;color:${activeStatus.color};margin-top:3px;">${activeActual}%</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
        <button class="filter-btn active" onclick="document.querySelector('.rm-block.active')?.scrollIntoView({behavior:'smooth',block:'center'})">JUMP TO ACTIVE</button>
        <button class="filter-btn" onclick="setTab('ksap')">OPEN KSAP</button>
        <button class="filter-btn" onclick="setTab('topics')">OPEN TOPICS</button>
      </div>`;
    el.appendChild(hero);
  }

  const sumDiv = document.createElement("div");
  sumDiv.className = "rm-summary";
  sumDiv.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
      <span style="font-size:10px;color:var(--grey);letter-spacing:0.1em;">STUDY ROADMAP · Apr 2026 → ${finalEnd.toLocaleDateString("en-GB",{month:"short",year:"numeric"})}</span>
      <span style="font-size:11px;color:var(--cyan);font-weight:500;">${daysLeft}d remaining</span>
    </div>
    <div class="rm-timeline"><div class="rm-timeline-fill" style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--grey2);">
      <span>Apr 2026</span><span style="color:var(--cyan)">${pct}% through</span><span>${finalEnd.toLocaleDateString("en-GB",{month:"short",year:"numeric"})}</span>
    </div>`;
  el.appendChild(sumDiv);

  roadmapData.forEach((block, idx) => {
    const blockStart = new Date(block.start);
    const blockEnd = new Date(block.end);
    const isActive = idx === currentIdx;
    const isDone = blockEnd < today;
    const color = CAT_COLORS[block.cat] || CAT_COLORS[normCat(block.cat)] || "var(--cyan)";
    const topicPct = catTopicPct(block.cat);
    const ksapPct = catKsapPct(block.cat);
    const accuracyPct = catKsapAccuracyPct(block.cat);
    const actual = actualBlockProgress(block.cat);
    const expected = expectedBlockProgress(block, new Date());
    const status = progressStatus(actual, expected);
    const expanded = rmExpanded.has(idx);
    const blockDaysLeft = Math.max(0, Math.round((blockEnd - today) / 86400000));
    const blockTotalDays = Math.max(1, Math.round((blockEnd - blockStart) / 86400000) + 1);
    const blockElapsedDays = Math.max(0, Math.min(blockTotalDays, blockTotalDays - blockDaysLeft));
    const blockDur = blockDays(block);
    const loadLabel = blockDur <= 14 ? "INTENSE" : blockDur <= 28 ? "STANDARD" : "DEEP DIVE";
    const statusLabel = isDone ? "COMPLETED" : isActive ? status.label : "UPCOMING";
    const statusClass = isDone ? "completed" : isActive ? "active" : "upcoming";

    const div = document.createElement("div");
    div.className = "rm-block" + (isActive ? " active" : "") + (isDone ? " completed" : "");
    div.style.borderLeftColor = isActive ? status.color : color;

    div.innerHTML = `
      <div class="rm-header" onclick="rmExpanded.has(${idx})?rmExpanded.delete(${idx}):rmExpanded.add(${idx});renderRoadmap();">
        <div style="width:8px;height:8px;border-radius:50%;background:${isActive?status.color:isDone?'var(--green)':'var(--border2)'};flex-shrink:0;"></div>
        <div class="rm-cat" style="color:${isActive?'var(--white)':isDone?'var(--grey)':'var(--grey)'}">
          ${block.cat}
          <div style="font-size:8px;color:var(--grey2);font-weight:400;margin-top:2px;">
            Expected ${expected}% · Actual ${actual}% · ${status.delta >= 0 ? "+" : ""}${status.delta}%
          </div>
        </div>
        <span style="font-size:9px;color:var(--grey);white-space:nowrap;">${blockDur}d · ${loadLabel}</span>
        <div class="rm-dates">${blockStart.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})} → ${blockEnd.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}</div>
        <span class="rm-badge ${statusClass}" style="${isActive ? `color:${status.color};border-color:${status.color};background:${status.bg};` : ""}">${statusLabel}</span>
        <div style="font-size:10px;color:var(--grey2);">${expanded ? "▾" : "▸"}</div>
      </div>`;

    if (expanded) {
      const body = document.createElement("div");
      body.className = "rm-body";
      body.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;margin-bottom:12px;">
          <div>
            <div style="font-size:8px;color:var(--grey);letter-spacing:0.1em;margin-bottom:4px;">EXPECTED PROGRESS</div>
            <div class="rm-progress-bg"><div class="rm-progress" style="width:${expected}%;background:var(--grey);"></div></div>
            <div style="font-size:9px;color:var(--grey);margin-top:2px;">${expected}% expected by today</div>
          </div>
          <div>
            <div style="font-size:8px;color:var(--grey);letter-spacing:0.1em;margin-bottom:4px;">ACTUAL PROGRESS</div>
            <div class="rm-progress-bg"><div class="rm-progress" style="width:${actual}%;background:${status.color};"></div></div>
            <div style="font-size:9px;color:${status.color};margin-top:2px;">${actual}% actual · ${status.label}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">
          <div class="rm-mini-card"><div class="rm-mini-label">TOPICS</div><div class="rm-mini-value" style="color:${pctColor(topicPct)};">${topicPct !== null ? topicPct + "%" : "—"}</div></div>
          <div class="rm-mini-card"><div class="rm-mini-label">KSAP ATTEMPTED</div><div class="rm-mini-value" style="color:${pctColor(ksapPct)};">${ksapPct !== null ? ksapPct + "%" : "—"}</div></div>
          <div class="rm-mini-card"><div class="rm-mini-label">P1 ACCURACY</div><div class="rm-mini-value" style="color:${pctColor(accuracyPct)};">${accuracyPct !== null ? accuracyPct + "%" : "—"}</div></div>
        </div>
        <div style="font-size:9px;color:var(--grey2);margin-bottom:10px;">Block day ${blockElapsedDays}/${blockTotalDays}${isActive ? ` · ${blockDaysLeft}d left` : ""}</div>
        ${isActive ? `
          <div style="background:var(--bg);border:1px solid var(--border);border-left:3px solid ${status.color};padding:9px 10px;margin-bottom:12px;">
            <div style="font-size:8px;color:var(--grey);letter-spacing:0.1em;margin-bottom:5px;">THIS BLOCK TARGETS</div>
            <div style="font-size:9px;color:var(--white);line-height:1.7;">
              → Read/review the core ${block.cat} subtopics<br>
              → Attempt all ${block.cat} KSAP Pass 1 questions<br>
              → Add notes to incorrect questions and clear them in Error Log
            </div>
          </div>` : ""}
        <div style="font-size:8px;color:var(--grey);letter-spacing:0.1em;margin-bottom:6px;border-top:1px solid var(--border);padding-top:10px;">EDIT BLOCK</div>
        <div class="rm-edit-row">
          <span style="font-size:9px;color:var(--grey2);">Start date:</span>
          <input class="rm-inp" type="date" id="rm-start-${idx}" value="${block.start}" />
          <span style="font-size:9px;color:var(--grey2);">Duration (days):</span>
          <input class="rm-inp" type="number" id="rm-days-${idx}" value="${blockDur}" min="1" max="180" style="width:70px;" />
          <button class="rm-save-btn" onclick="saveRmBlock(${idx})">SAVE & CASCADE ▸</button>
        </div>`;
      div.appendChild(body);
    }
    el.appendChild(div);
  });
}

function saveRmBlock(idx) {
  if (!roadmapData) return;
  const startVal = document.getElementById(`rm-start-${idx}`)?.value;
  const daysVal = parseInt(document.getElementById(`rm-days-${idx}`)?.value || "0");
  if (!startVal || !daysVal || daysVal < 1) return;
  roadmapData[idx].start = startVal;
  roadmapData[idx].days = daysVal;
  delete roadmapData[idx].months; // drop legacy field
  const end = new Date(new Date(startVal).getTime() + (daysVal - 1) * 86400000);
  roadmapData[idx].end = end.toISOString().split("T")[0];
  cascadeRoadmap(roadmapData, idx);
  saveRoadmap();
  renderRoadmap();
}


// ══════════════════════════════════════════════════════════════════════
// ADMIN PANEL
// ══════════════════════════════════════════════════════════════════════
let adminSubTab = "topics";
const ALL_CATS = [...new Set(KSAP.map(q => q.category))].sort();
const ALL_MODULES = [...new Set(KSAP.map(q => q.module))].sort();

function renderAdmin() {
  const el = document.getElementById("tab-admin");
  el.innerHTML = "";

  // Sub-tab bar
  const subBar = document.createElement("div");
  subBar.style.cssText = "display:flex;border-bottom:1px solid var(--border2);margin-bottom:20px;";
  // Seed button — first time setup
  const seedBtn = document.createElement("button");
  seedBtn.style.cssText = "margin-left:auto;padding:4px 12px;border:1px solid var(--grey2);background:transparent;color:var(--grey2);font-family:var(--font);font-size:9px;cursor:pointer;letter-spacing:0.06em;";
  seedBtn.textContent = "⬆ SEED TO FIREBASE";
  seedBtn.title = "Push hardcoded arrays to Firebase — run once on first use";
  seedBtn.onmouseover = () => { seedBtn.style.borderColor = "var(--cyan)"; seedBtn.style.color = "var(--cyan)"; };
  seedBtn.onmouseout  = () => { seedBtn.style.borderColor = "var(--grey2)"; seedBtn.style.color = "var(--grey2)"; };
  seedBtn.onclick = () => {
    if (confirm("Push current KSAP and TOPICS arrays to Firebase?\n\nDo this once on first use. After that, edits save automatically.")) {
      seedConfigToFirebase();
      alert("✓ Seeded to Firebase. Edits will now persist automatically.");
    }
  };
  subBar.appendChild(seedBtn);

  [
    { id:"topics",    label:"TOPIC EDITOR" },
    { id:"questions", label:"QUESTION EDITOR" },
  ].forEach(st => {
    const btn = document.createElement("button");
    btn.style.cssText = `padding:8px 18px;background:transparent;border:none;
      border-bottom:2px solid ${adminSubTab===st.id?"var(--cyan)":"transparent"};
      color:${adminSubTab===st.id?"var(--cyan)":"var(--grey)"};
      font-family:var(--font);font-size:10px;letter-spacing:0.1em;cursor:pointer;`;
    btn.textContent = st.label;
    btn.onclick = () => { adminSubTab = st.id; renderAdmin(); };
    subBar.appendChild(btn);
  });
  el.appendChild(subBar);

  if (adminSubTab === "topics") renderAdminTopics(el);
  if (adminSubTab === "questions") renderAdminQuestions(el);
}

// ── TOPIC EDITOR ──────────────────────────────────────────────────────
function renderAdminTopics(el) {
  // Add subtopic form
  const addHead = document.createElement("div");
  addHead.className = "sec-head";
  addHead.innerHTML = `<span class="sec-title">ADD SUBTOPIC</span><span class="sec-rule"></span>`;
  el.appendChild(addHead);

  const addForm = document.createElement("div");
  addForm.style.cssText = "background:var(--bg2);border:1px solid var(--border2);border-top:2px solid var(--cyan);padding:14px;margin-bottom:24px;display:flex;flex-direction:column;gap:10px;";
  addForm.innerHTML = `
    <div class="admin-row">
      <span class="admin-tag">CATEGORY</span>
      <select class="admin-sel" id="admin-topic-cat" style="flex:1;max-width:360px;">
        ${Object.keys(TOPICS).map(c => `<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join("")}
      </select>
    </div>
    <div class="admin-row">
      <span class="admin-tag">TOPIC</span>
      <select class="admin-sel" id="admin-topic-topic" style="flex:1;max-width:360px;"></select>
      <input class="admin-inp" id="admin-topic-newtopic" placeholder="or type new topic name..." style="flex:1;max-width:240px;" />
    </div>
    <div class="admin-row">
      <span class="admin-tag">SUBTOPIC</span>
      <input class="admin-inp" id="admin-topic-sub" placeholder="Subtopic name..." style="flex:1;max-width:400px;" />
    </div>
    <div class="admin-row">
      <button class="admin-btn" onclick="adminAddSubtopic()">ADD SUBTOPIC ▸</button>
      <span style="font-size:9px;color:var(--grey2);">// leave topic name blank to use dropdown selection</span>
    </div>`;
  el.appendChild(addForm);

  // Populate topic dropdown based on category
  const catSel = document.getElementById("admin-topic-cat");
  if (catSel) {
    catSel.onchange = () => populateTopicDropdown();
    populateTopicDropdown();
  }

  // Browse existing topics
  const browseHead = document.createElement("div");
  browseHead.className = "sec-head";
  browseHead.innerHTML = `<span class="sec-title">BROWSE & DELETE SUBTOPICS</span><span class="sec-rule"></span>`;
  el.appendChild(browseHead);

  Object.entries(TOPICS).forEach(([cat, topicsObj]) => {
    const color = CAT_COLORS[cat] || "var(--cyan)";
    const catDiv = document.createElement("div");
    catDiv.style.cssText = "margin-bottom:14px;";

    const catHead = document.createElement("div");
    catHead.style.cssText = `font-size:10px;font-weight:500;color:${color};letter-spacing:0.1em;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:6px;`;
    catHead.textContent = cat;
    catDiv.appendChild(catHead);

    Object.entries(topicsObj).forEach(([topic, subs]) => {
      const topicDiv = document.createElement("div");
      topicDiv.style.cssText = "margin-bottom:8px;background:var(--bg2);border:1px solid var(--border2);border-left:3px solid " + color + ";";

      const topicHead = document.createElement("div");
      topicHead.style.cssText = "font-size:9px;color:var(--grey);letter-spacing:0.1em;padding:5px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;";
      topicHead.innerHTML = `<span>${topic}</span><span style="color:var(--grey2)">${subs.length} subtopics</span>`;
      topicDiv.appendChild(topicHead);

      subs.forEach((sub, idx) => {
        const row = document.createElement("div");
        row.className = "st-admin-row";
        row.innerHTML = `
          <span style="flex:1;color:var(--grey);">${sub}</span>
          <button class="admin-btn danger" style="font-size:8px;padding:1px 8px;"
            onclick="adminDeleteSubtopic('${escAttr(cat)}','${escAttr(topic)}',${idx})">✕</button>`;
        topicDiv.appendChild(row);
      });

      catDiv.appendChild(topicDiv);
    });
    el.appendChild(catDiv);
  });
}

function populateTopicDropdown() {
  const catSel = document.getElementById("admin-topic-cat");
  const topicSel = document.getElementById("admin-topic-topic");
  if (!catSel || !topicSel) return;
  const cat = catSel.value;
  const topics_in_cat = TOPICS[cat] ? Object.keys(TOPICS[cat]) : [];
  topicSel.innerHTML = topics_in_cat.map(t => `<option value="${t.replace(/"/g,'&quot;')}">${t}</option>`).join("");
}

function adminAddSubtopic() {
  const cat      = document.getElementById("admin-topic-cat")?.value;
  const topicSel = document.getElementById("admin-topic-topic")?.value;
  const newTopic = document.getElementById("admin-topic-newtopic")?.value.trim();
  const sub      = document.getElementById("admin-topic-sub")?.value.trim();
  const topic    = newTopic || topicSel;
  if (!cat || !topic || !sub) { alert("Please fill in category, topic and subtopic."); return; }

  if (!TOPICS[cat]) TOPICS[cat] = {};
  if (!TOPICS[cat][topic]) TOPICS[cat][topic] = [];
  if (TOPICS[cat][topic].includes(sub)) { alert("Subtopic already exists."); return; }
  TOPICS[cat][topic].push(sub);
  saveTopicsToFirebase();

  // Clear inputs
  document.getElementById("admin-topic-sub").value = "";
  document.getElementById("admin-topic-newtopic").value = "";
  alert(`✓ Added "${sub}" to ${topic}`);
  renderAdmin();
}

function adminDeleteSubtopic(cat, topic, idx) {
  const sub = TOPICS[cat]?.[topic]?.[idx];
  if (!sub) return;
  if (!confirm(`Delete subtopic: "${sub}"?`)) return;
  TOPICS[cat][topic].splice(idx, 1);
  if (TOPICS[cat][topic].length === 0) delete TOPICS[cat][topic];
  saveTopicsToFirebase();
  renderAdmin();
  renderTopics();
}

// ── QUESTION EDITOR ───────────────────────────────────────────────────
function renderAdminQuestions(el) {
  const addHead = document.createElement("div");
  addHead.className = "sec-head";
  addHead.innerHTML = `<span class="sec-title">ADD QUESTION</span><span class="sec-rule"></span>`;
  el.appendChild(addHead);

  const addForm = document.createElement("div");
  addForm.style.cssText = "background:var(--bg2);border:1px solid var(--border2);border-top:2px solid var(--cyan);padding:14px;margin-bottom:24px;display:flex;flex-direction:column;gap:10px;";
  addForm.innerHTML = `
    <div class="admin-row">
      <span class="admin-tag">CODE</span>
      <input class="admin-inp" id="admin-q-code" placeholder="e.g. V12M1-Q1" style="max-width:180px;" />
      <span style="font-size:9px;color:var(--grey2);">// format: VXX-QY</span>
    </div>
    <div class="admin-row">
      <span class="admin-tag">CATEGORY</span>
      <select class="admin-sel" id="admin-q-cat" style="flex:1;max-width:360px;">
        ${ALL_CATS.map(c => `<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join("")}
      </select>
    </div>
    <div class="admin-row">
      <span class="admin-tag">MODULE</span>
      <select class="admin-sel" id="admin-q-mod" style="max-width:160px;">
        ${ALL_MODULES.map(m => `<option value="${m}">${m}</option>`).join("")}
        <option value="custom">custom</option>
      </select>
      <input class="admin-inp" id="admin-q-custmod" placeholder="custom module name" style="max-width:180px;" />
    </div>
    <div class="admin-row">
      <button class="admin-btn" onclick="adminAddQuestion()">ADD QUESTION ▸</button>
    </div>`;
  el.appendChild(addForm);

  // Browse questions with edit/delete
  const browseHead = document.createElement("div");
  browseHead.className = "sec-head";
  browseHead.innerHTML = `<span class="sec-title">BROWSE & EDIT QUESTIONS</span><span class="sec-rule"></span><span class="sec-note">${KSAP.length} total</span>`;
  el.appendChild(browseHead);

  // Search
  const searchWrap = document.createElement("div");
  searchWrap.style.cssText = "margin-bottom:12px;";
  searchWrap.innerHTML = `<input class="admin-inp wide" id="admin-q-search" placeholder="// search by code or category..." oninput="renderAdminQList()" />`;
  el.appendChild(searchWrap);

  const listEl = document.createElement("div");
  listEl.id = "admin-q-list";
  listEl.style.cssText = "background:var(--bg2);border:1px solid var(--border2);max-height:500px;overflow-y:auto;";
  el.appendChild(listEl);

  renderAdminQList();
}

function renderAdminQList() {
  const el = document.getElementById("admin-q-list");
  if (!el) return;
  const search = (document.getElementById("admin-q-search")?.value || "").toLowerCase();
  const filtered = KSAP.filter(q =>
    q.code.toLowerCase().includes(search) || q.category.toLowerCase().includes(search) || q.module.toLowerCase().includes(search)
  );

  // Header
  el.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:8px;color:var(--grey);letter-spacing:0.1em;">
    <span style="min-width:90px;">CODE</span>
    <span style="flex:1;">CATEGORY</span>
    <span style="min-width:60px;">MODULE</span>
    <span style="min-width:80px;text-align:right;">ACTIONS</span>
  </div>` + filtered.slice(0, 200).map((q, i) => {
    const color = CAT_COLORS[q.category] || "var(--cyan)";
    return `<div class="q-admin-row">
      <span style="min-width:90px;color:${color};font-size:9px;">${q.code}</span>
      <span style="flex:1;font-size:10px;color:var(--grey);">${q.category}</span>
      <span style="min-width:60px;font-size:9px;color:var(--grey2);">${q.module}</span>
      <div style="display:flex;gap:4px;min-width:80px;justify-content:flex-end;">
        <button class="admin-btn" style="font-size:8px;padding:1px 6px;" onclick="adminEditQuestion(${KSAP.indexOf(q)})">✎</button>
        <button class="admin-btn danger" style="font-size:8px;padding:1px 6px;" onclick="adminDeleteQuestion(${KSAP.indexOf(q)})">✕</button>
      </div>
    </div>`;
  }).join("") + (filtered.length > 200 ? `<div style="padding:8px 10px;font-size:9px;color:var(--grey2);">// showing first 200 of ${filtered.length} — refine search to see more</div>` : "");
}

function adminAddQuestion() {
  const code    = document.getElementById("admin-q-code")?.value.trim().toUpperCase();
  const cat     = document.getElementById("admin-q-cat")?.value;
  const modSel  = document.getElementById("admin-q-mod")?.value;
  const custMod = document.getElementById("admin-q-custmod")?.value.trim();
  const module  = modSel === "custom" ? custMod : modSel;
  if (!code || !cat || !module) { alert("Please fill in code, category and module."); return; }
  if (KSAP.find(q => q.code === code)) { alert(`Question ${code} already exists.`); return; }
  KSAP.push({ code, category: cat, module });
  saveKsapToFirebase();
  document.getElementById("admin-q-code").value = "";
  alert(`✓ Added ${code}`);
  renderAdminQList();
  renderKSAP();
}

function adminEditQuestion(idx) {
  const q = KSAP[idx];
  if (!q) return;
  const cats = ALL_CATS.join("\n");
  const newCat = prompt(`Edit category for ${q.code}:\n\nCurrent: ${q.category}\n\nAvailable categories:\n${ALL_CATS.map((c,i) => (i+1)+". "+c).join("\n")}\n\nType the new category exactly:`, q.category);
  if (!newCat || newCat === q.category) return;
  if (!ALL_CATS.includes(newCat) && !Object.keys(TOPICS).includes(newCat)) {
    if (!confirm(`"${newCat}" is not an existing category. Add anyway?`)) return;
  }
  KSAP[idx].category = newCat;
  saveQ(q.code, { reassignedCategory: newCat });
  saveKsapToFirebase();
  renderAdminQList();
  renderKSAP();
}

function adminDeleteQuestion(idx) {
  const q = KSAP[idx];
  if (!q) return;
  if (!confirm(`Delete question ${q.code}?\n\nThis also removes any saved answers for this question.`)) return;
  KSAP.splice(idx, 1);
  if (window._sce_fb) {
    const { db, ref, set } = window._sce_fb;
    const path = "sceData/ksap/" + qKey(q.code);
    set(ref(db, path), null);
  }
  saveKsapToFirebase();
  renderAdminQList();
  renderKSAP();
  renderAll();
}

// Init
roadmapData = buildDefaultRoadmap();
setTab("overview");
setTimeout(() => {
  if (!window._sce_data) {
    sceData = {};
    renderAll();
  }
}, 3000);
