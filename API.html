<!--
  Optional cloud sync bridge. This loads Firebase's modular SDK straight from
  Google's CDN and hands the handful of functions we need to the main script
  via window.fb. If there's no internet access, or the person never sets up
  cloud sync, this simply never fires — the rest of the app doesn't depend on it.
-->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut, sendPasswordResetEmail,
  } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
  import {
    getFirestore, doc, getDoc, setDoc, onSnapshot,
  } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

  window.fb = {
    initializeApp, getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut, sendPasswordResetEmail,
    getFirestore, doc, getDoc, setDoc, onSnapshot,
  };
  window.dispatchEvent(new Event('fb-sdk-ready'));
</script>
<style>
  /* ============ Palette themes (light) — role names kept for JS compatibility ============ */
  :root, [data-theme="sage"] {

    --accent-amber: #B07A22;     /* warning */
    --accent-amber-rgb: 176,122,34;
    --accent-rust: #A5462F;      /* danger */

    --brand-a: #1F7A72; --brand-b: #B07A22;

  }
  [data-theme="indigo"] {
    --bg: #EEF1F8;
    --glow: rgba(61,82,168,.11);
    --surface: #FFFFFF;
    --surface-2: #F5F7FC;
    --ink: #182033;
    --accent-teal: #3D52A8;
    --accent-teal-rgb: 61,82,168;
    --accent-amber: #B5842B;
    --accent-amber-rgb: 181,132,43;
    --accent-rust: #B0453F;
    --accent-rust-rgb: 176,69,63;
    --muted: #6A7391;
    --line: #E2E6F0;
    --brand-a: #3D52A8; --brand-b: #6E86E0;
  }
  [data-theme="warm"] {
    --bg: #F5F1E9;
    --glow: rgba(90,122,82,.11);
    --surface: #FFFDF9;
    --surface-2: #F3EEE3;
    --ink: #2A2420;
    --accent-teal: #557A4C;
    --accent-teal-rgb: 85,122,76;
    --accent-amber: #B0752A;
    --accent-amber-rgb: 176,117,42;
    --accent-rust: #A5442F;
    --accent-rust-rgb: 165,68,47;
    --muted: #857A6C;
    --line: #E7DFD1;

  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 560px at 100% -8%, var(--glow), transparent 62%),
      radial-gradient(900px 500px at -5% 8%, var(--glow), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    line-height: 1.5;

  }

    content: ""; position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60;
    background: linear-gradient(90deg, var(--brand-a), var(--brand-b));
  }
  a { color: var(--accent-teal); text-decoration: none; }
  a:hover { color: var(--ink); text-decoration: underline; }
  ::selection { background: rgba(var(--accent-teal-rgb), .16); }

  .serif { font-family: 'Source Serif 4', Georgia, serif; letter-spacing: -0.01em; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 44px 20px 90px; }

  .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: var(--accent-teal); margin-bottom: 7px; }
  h1.title { font-size: 2.4rem; margin: 0 0 6px; line-height: 1.1; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: .92rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(20,30,28,.04), 0 10px 30px -18px rgba(20,30,28,.18);

  .card-pad { padding: 20px 22px; }

  .section-head { margin-bottom: 22px; }
  .section-title { font-size: 1.55rem; margin: 0 0 5px; font-weight: 600; }
  .section-desc { color: var(--muted); font-size: .9rem; margin: 0; max-width: 660px; line-height: 1.55; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .84rem; font-weight: 600; font-family: inherit; letter-spacing: -0.005em;
    padding: 9px 16px; border-radius: 9px; border: 1px solid transparent;
    cursor: pointer; background: none; color: var(--ink);
    transition: background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .08s ease, color .15s ease;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent-teal); color: #fff; box-shadow: 0 1px 2px rgba(var(--accent-teal-rgb),.28), 0 8px 18px -8px rgba(var(--accent-teal-rgb),.5); }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent-teal) 88%, #000); box-shadow: 0 1px 2px rgba(var(--accent-teal-rgb),.3), 0 10px 22px -8px rgba(var(--accent-teal-rgb),.6); }
  .btn-outline { border-color: var(--line); background: var(--surface); box-shadow: 0 1px 2px rgba(20,30,28,.04); }
  .btn-outline:hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--line) 55%, var(--muted)); }
  .btn-danger-outline { border-color: rgba(var(--accent-rust-rgb), .35); color: var(--accent-rust); background: var(--surface); }
  .btn-danger-outline:hover { background: rgba(var(--accent-rust-rgb), .07); border-color: rgba(var(--accent-rust-rgb), .55); }
  .btn-danger { background: var(--accent-rust); color: #fff; box-shadow: 0 8px 18px -8px rgba(var(--accent-rust-rgb),.55); }

  label.field-label { display: block; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=date], textarea, select {

    border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    color: var(--ink); width: 100%;

  }
  input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
  textarea { min-height: 88px; resize: vertical; line-height: 1.55; }
  input:hover, textarea:hover, select:hover { border-color: color-mix(in srgb, var(--line) 50%, var(--muted)); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent-teal); box-shadow: 0 0 0 3.5px rgba(var(--accent-teal-rgb), .16); background: var(--surface); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

    .grid-2 { grid-template-columns: 1fr; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }

    .wrap { padding-top: 32px; }
  }

  .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 28px 0 28px; padding-bottom: 0; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    position: relative; display: flex; align-items: center; gap: 6px; padding: 11px 15px;

  .tab-btn::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--accent-teal); border-radius: 2px; transform: scaleX(0); transition: transform .2s ease; }
  .tab-btn.active { color: var(--ink); font-weight: 700; }
  .tab-btn.active::after { transform: scaleX(1); }
  .tab-btn:hover:not(.active) { color: var(--ink); background: rgba(var(--accent-teal-rgb), .06); }

  .stat-card { padding: 18px 20px; position: relative; overflow: hidden; }
  .stat-card::before { content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: linear-gradient(var(--accent-teal), color-mix(in srgb, var(--accent-teal) 55%, transparent)); opacity: .9; }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

  .alert > svg { color: var(--accent-amber); margin-top: 1px; }
  .alert-title { font-weight: 700; font-size: .9rem; margin-bottom: 3px; }
  .alert-desc { font-size: .84rem; color: var(--muted); line-height: 1.55; }

  .seg-label { text-align: center; font-size: 10px; color: var(--muted); margin-top: 6px; font-weight: 600; }

  .list-entry { display: flex; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 15px; background: var(--surface); margin-bottom: 9px; box-shadow: 0 1px 2px rgba(20,30,28,.03); transition: border-color .15s ease, box-shadow .15s ease; }
  .list-entry:hover { border-color: color-mix(in srgb, var(--line) 55%, var(--accent-teal)); box-shadow: 0 10px 26px -18px rgba(var(--accent-teal-rgb),.4); }

  .sync-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(0,0,0,.03); }
  .sync-dot.ok { background: var(--accent-teal); }
  .sync-dot.busy { background: var(--accent-amber); }
  .sync-dot.bad { background: var(--accent-rust); }
  .sync-dot.off { background: var(--muted); }
  .sync-row { display: flex; align-items: flex-start; gap: 9px; font-size: .84rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .sync-row .sync-dot { margin-top: 6px; }

  /* ============ Palette switcher ============ */
  #theme-switch {
    position: fixed; top: 16px; right: 18px; z-index: 70;
    display: flex; gap: 4px; padding: 5px; border-radius: 12px;

  #theme-switch .ts-btn .sw { width: 18px; height: 18px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); transition: transform .12s ease; }
  #theme-switch .ts-btn.active { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--accent-teal); }
  #theme-switch .ts-btn.active .sw { transform: scale(1.05); }
  @media (max-width: 560px) { #theme-switch { top: 10px; right: 10px; } }
</style>

<script>
/* ======================================================================
   Associate PI Tracker — standalone build
   Vanilla HTML/CSS/JS. Persists to the browser's localStorage.
   ====================================================================== */

const STORAGE_KEY = 'paladin-pi-tracker-v1';

const SITE_OPTIONS = [
  'Hull Royal Infirmary',
  'Northern General Hospital, Sheffield',
  "St James's University Hospital, Leeds",
  'Other site',
];

const MANDATED_ITEMS = [
  { id: 1, type: 'checkbox', label: "I've acted as a member of the research team and signed the study-specific site delegation log / site contact information." },
  { id: 2, type: 'checkbox', label: "I've worked with the PI to make sure the delegation log / site contact information is correctly completed for every member of the research team." },
  { id: 3, type: 'textarea', label: 'How have you helped disseminate the study in your local environment? Include engagement with relevant departments.' },
  { id: 4, type: 'textarea', label: 'Describe a presentation you gave about the study to engage key staff and stakeholders.' },
  { id: 5, type: 'textarea', label: 'Detail your regular engagement with the PI and the rest of the research team to help deliver the study.' },
  { id: 6, type: 'textarea', label: "Describe how you helped the PI confirm every team member submitted a signed CV, had up-to-date GCP training, and was issued a GCP certificate. Enter 'Not applicable' if not relevant." },
  { id: 7, type: 'textarea', label: 'Describe how you helped the PI ensure all delegated staff were adequately informed of protocol requirements and trained in study procedures.' },
  { id: 8, type: 'checkbox', label: "I've kept a diary of research team meetings (at least monthly)." },
  { id: 9, type: 'checkbox', label: "I've been involved in study delivery for at least 6 months." },
  { id: 10, type: 'textarea', label: "Describe the regular checks you performed to ensure appropriate participants were screened and recruited. Enter 'Not applicable' if not relevant." },
  { id: 11, type: 'checkbox', label: "I've completed the 'Equality, Diversity and Inclusion in Health and Social Care Research' training." },
  { id: 12, type: 'textarea', label: 'Outline your involvement in recruiting, consenting and/or following up a defined number of participants (or equivalent activity, e.g. data sharing/linkage/cleaning). Keep in line with the Clinical Trials Regulations and local R&D permissions.' },
  { id: 13, type: 'textarea', label: 'Commercial studies only: outline at least 3 instances where you directly reported to / communicated with the Sponsor or CRO. Skip if this is a non-commercial study.' },
  { id: 14, type: 'checkbox', label: 'I understand three signatures (from three separate parties) are required before my checklist can be submitted.' },
];

const ACTIVITY_TYPES = [
  { value: 'study', label: 'Additional study-related activity' },
  { value: 'ppi', label: 'Patient & Public Involvement (PPI)' },
  { value: 'tmg', label: 'Trial Management Group (TMG)' },
  { value: 'training', label: 'Training course' },
];

const SCHEDULE_OF_ASSESSMENTS = [
  { visit: 'Screening (Day -28 to 0)', notes: 'Eligibility, consent, randomisation, baseline bloods, 6MWT, IPOS-Renal, KDQOL-SF, PROMIS, MoCA' },
  { visit: 'Month 3', notes: 'Bloods, obs, 6MWT, IPOS-Renal, AE review, ESA dose' },
  { visit: 'Month 6', notes: 'Bloods, obs, 6MWT, IPOS-Renal, AE review, ESA dose' },
  { visit: 'Month 9', notes: 'Bloods, obs, 6MWT, IPOS-Renal, AE review, ESA dose' },
  { visit: 'Month 12', notes: 'Bloods, obs, 6MWT, IPOS-Renal, KDQOL-SF, PROMIS, MoCA, health economic assessment' },
];

const NAV = [
  { id: 'overview', label: 'Overview' },
  { id: 'checklist', label: 'Mandated checklist' },
  { id: 'activities', label: 'Additional activities' },
  { id: 'paladin', label: 'PALaDIN tasks' },
  { id: 'reminders', label: 'Reminders' },
  { id: 'journal', label: 'Journal' },
  { id: 'settings', label: 'Settings' },
];

/* ---------------------------------------------------------------------- */
/* Helpers                                                                  */
/* ---------------------------------------------------------------------- */

function todayISO() { return new Date().toISOString().slice(0, 10); }

function addMonthsISO(iso, n) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0, 10);
}

function monthsBetween(startISO, endISO) {
  if (!startISO || !endISO) return 0;
  const a = new Date(startISO + 'T00:00:00');
  const b = new Date(endISO + 'T00:00:00');
  let months = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) months -= 1;
  return months;
}

function daysBetween(startISO, endISO) {
  if (!startISO || !endISO) return 0;
  const a = new Date(startISO + 'T00:00:00');
  const b = new Date(endISO + 'T00:00:00');
  return Math.round((b - a) / (1000 * 60 * 60 * 24));
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through to legacy path */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

var state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const base = defaultData();
    return {
      ...base,
      ...parsed,
      settings: { ...base.settings, ...(parsed.settings || {}) },
      checklist: { ...base.checklist, ...(parsed.checklist || {}) },
    };
  } catch (e) {
    return defaultData();
  }
}

function save() {
  state.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    showToast("Couldn't save — your browser may be blocking local storage.");
  }
  queueCloudPush();
}

/* Cloud sync (optional, Firebase-backed)                                   */

const FB_CONFIG_KEY = 'paladin-pi-tracker-fb-config';

function loadCloudConfig() {
  try {
    const raw = localStorage.getItem(FB_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveCloudConfig(cfg) {
  try { localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
}

function clearCloudConfigStorage() {
  try { localStorage.removeItem(FB_CONFIG_KEY); } catch (e) { /* ignore */ }
}

// Accepts either strict JSON or the exact snippet the Firebase console gives you
// (an unquoted-key JS object literal, optionally prefixed with "const firebaseConfig =").
function parseFirebaseConfigInput(text) {
  if (!text) return null;
  const cleaned = text.trim()
    .replace(/^\s*(const|let|var)\s+\w+\s*=\s*/, '')
    .replace(/;\s*$/, '');
  try {
    const viaJSON = JSON.parse(cleaned);
    if (viaJSON && viaJSON.apiKey && viaJSON.projectId) return viaJSON;
  } catch (e) { /* fall through to relaxed parse */ }
  try {
    // Safe here: this only ever runs on text the person pasted into their own
    // browser's Settings field — never on remote or third-party data.
    const viaLiteral = Function('"use strict"; return (' + cleaned + ');')();
    if (viaLiteral && typeof viaLiteral === 'object' && viaLiteral.apiKey && viaLiteral.projectId) return viaLiteral;
    return null;
  } catch (e) {
    return null;
  }
}

var cloudConfig = loadCloudConfig();
var fbApp = null, fbAuth = null, fbDb = null;
var cloudUser = null;
var cloudUnsub = null;
var cloudPushTimer = null;
var cloudStatus = cloudConfig ? 'connecting' : 'not-configured'; // not-configured | connecting | signed-out | syncing | synced | error
var cloudErrorMsg = '';

function setCloudStatus(status, errMsg) {
  cloudStatus = status;
  cloudErrorMsg = errMsg || '';
  renderCloudSyncBlock();
}

function initFirebaseIfConfigured() {
  if (!cloudConfig || !window.fb || fbApp) return;
  try {
    fbApp = window.fb.initializeApp(cloudConfig);
    fbAuth = window.fb.getAuth(fbApp);
    fbDb = window.fb.getFirestore(fbApp);
    window.fb.onAuthStateChanged(fbAuth, onCloudAuthChanged, (err) => setCloudStatus('error', err.message));
  } catch (e) {
    setCloudStatus('error', e.message);
  }
}

function onCloudAuthChanged(user) {
  if (cloudUnsub) { cloudUnsub(); cloudUnsub = null; }
  cloudUser = user;
  if (user) {
    setCloudStatus('syncing');
    attachCloudListener(user.uid);
    syncNowInitial(user.uid);
  } else {
    setCloudStatus('signed-out');
  }
}

function mergeIncoming(data) {
  const base = defaultData();
  return {
    ...base,
    ...data,
    settings: { ...base.settings, ...(data.settings || {}) },
    checklist: { ...base.checklist, ...(data.checklist || {}) },
  };
}

function attachCloudListener(uid) {
  const ref = window.fb.doc(fbDb, 'trackers', uid);
  cloudUnsub = window.fb.onSnapshot(ref, (snap) => {
    if (snap.metadata && snap.metadata.hasPendingWrites) return; // ignore echo of our own write
    if (!snap.exists()) return;
    const data = snap.data();
    if (!data.updatedAt || (state.updatedAt && data.updatedAt <= state.updatedAt)) return; // not newer than what we have
    state = mergeIncoming(data);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setCloudStatus('synced');
    renderApp();
    showToast('Pulled a newer update from another device.');
  }, (err) => setCloudStatus('error', err.message));
}

async function syncNowInitial(uid) {
  try {
    const ref = window.fb.doc(fbDb, 'trackers', uid);
    const snap = await window.fb.getDoc(ref);
    if (snap.exists()) {
      const data = snap.data();
      if (!state.updatedAt || (data.updatedAt && data.updatedAt > state.updatedAt)) {
        state = mergeIncoming(data);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderApp();
      } else {
        await pushToCloudNow();
      }
    } else {
      await pushToCloudNow();
    }
    setCloudStatus('synced');
  } catch (e) {
    setCloudStatus('error', e.message);
  }
}

async function pushToCloudNow() {
  if (!cloudUser || !fbDb) return;
  try {
    const ref = window.fb.doc(fbDb, 'trackers', cloudUser.uid);
    await window.fb.setDoc(ref, state);
    setCloudStatus('synced');
  } catch (e) {
    setCloudStatus('error', e.message);
  }
}

function queueCloudPush() {
  if (!cloudUser) return;
  setCloudStatus('syncing');
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloudNow, 1500);
}

function friendlyAuthError(e) {
  const code = (e && e.code) || '';
  const map = {
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/user-not-found': 'No account with that email — try creating one.',
    'auth/wrong-password': 'Wrong password.',
    'auth/email-already-in-use': 'An account with that email already exists — try signing in instead.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/invalid-credential': 'Email or password is incorrect.',
    'auth/too-many-requests': 'Too many attempts — wait a bit and try again.',
    'auth/unauthorized-domain': "This page's web address isn't authorised in Firebase. In the Firebase console go to Authentication → Settings → Authorized domains and add the domain you're opening this file from (e.g. localhost, or your host). Opening the file directly as file:// won't work — serve it over http/https.",
    'auth/operation-not-allowed': 'Email/Password sign-in is turned off. In the Firebase console enable Authentication → Sign-in method → Email/Password.',
    'auth/configuration-not-found': 'Firebase can\u2019t find your Authentication setup. Make sure you\u2019ve enabled Authentication (Email/Password) in the console and pasted the config from the same project.',
    'auth/network-request-failed': 'Network problem reaching Firebase — check your internet connection, VPN, or firewall and try again.',
    'auth/api-key-not-valid': 'The API key in your config isn\u2019t valid — re-copy the whole config snippet from the Firebase console.',
    'auth/invalid-api-key': 'The API key in your config isn\u2019t valid — re-copy the whole config snippet from the Firebase console.',
  };
  return map[code] || ('Something went wrong (' + (code || (e && e.message) || 'unknown error') + ').');
}

async function cloudSignIn() {
  if (!fbAuth) { showToast('Cloud sync isn\u2019t connected yet — save your Firebase config first.'); return; }
  const email = document.getElementById('fb-email').value.trim();
  const pw = document.getElementById('fb-password').value;
  if (!email || !pw) { showToast('Enter an email and password first.'); return; }
  try { await window.fb.signInWithEmailAndPassword(fbAuth, email, pw); }
  catch (e) { const msg = friendlyAuthError(e); showToast(msg); setCloudStatus('error', msg); }
}

async function cloudSignUp() {
  if (!fbAuth) { showToast('Cloud sync isn\u2019t connected yet — save your Firebase config first.'); return; }
  const email = document.getElementById('fb-email').value.trim();
  const pw = document.getElementById('fb-password').value;
  if (!email || !pw) { showToast('Enter an email and password first.'); return; }
  try { await window.fb.createUserWithEmailAndPassword(fbAuth, email, pw); }
  catch (e) { const msg = friendlyAuthError(e); showToast(msg); setCloudStatus('error', msg); }
}

async function cloudSignOutAction() {
  try { await window.fb.signOut(fbAuth); showToast('Signed out — your data stays saved locally.'); }
  catch (e) { showToast(friendlyAuthError(e)); }
}

async function cloudResetPassword() {
  const email = document.getElementById('fb-email').value.trim();
  if (!email) { showToast('Enter your email above first.'); return; }
  try { await window.fb.sendPasswordResetEmail(fbAuth, email); showToast('Password reset email sent.'); }
  catch (e) { showToast(friendlyAuthError(e)); }
}

function saveCloudConfigFromInput() {
  const text = document.getElementById('fb-config-input').value;
  const parsed = parseFirebaseConfigInput(text);
  if (!parsed) { showToast("Couldn't read that config — paste the snippet exactly as Firebase gave it to you."); return; }
  cloudConfig = parsed;
  saveCloudConfig(parsed);
  setCloudStatus('connecting');
  initFirebaseIfConfigured();
  setTimeout(() => {
    if (cloudStatus === 'connecting') setCloudStatus('error', 'Could not reach the cloud sync library — check your internet connection and try again.');
  }, 9000);
}

function removeCloudConfigAction() {
  if (cloudUnsub) { cloudUnsub(); cloudUnsub = null; }
  cloudConfig = null;
  cloudUser = null;
  fbApp = fbAuth = fbDb = null;
  clearCloudConfigStorage();
  setCloudStatus('not-configured');
}

function renderCloudSyncBlock() {
  const el = document.getElementById('cloud-sync-block');
  if (!el) return; // settings tab isn't showing right now
  el.innerHTML = cloudSyncBlockHTML();
  bindCloudSyncEvents();
}

function cloudSyncBlockHTML() {
  const dotClass = { 'not-configured': 'off', connecting: 'busy', 'signed-out': 'off', syncing: 'busy', synced: 'ok', error: 'bad' }[cloudStatus] || 'off';
  const statusLine = {

      <p style="font-size:.78rem; color:var(--muted); margin:0 0 8px;">
        Create a free project at <span class="mono">firebase.google.com</span>, enable

      </p>

      <button class="btn btn-primary btn-sm" data-action="save-fb-config">Save config</button>
    `;
  } else if (cloudStatus === 'signed-out' || cloudStatus === 'connecting' || cloudStatus === 'error') {
    body = `
      <div class="grid-2" style="margin-bottom:8px;">
        <div><label class="field-label">Email</label><input type="text" id="fb-email" placeholder="you@example.com"></div>
        <div><label class="field-label">Password</label><input type="password" id="fb-password" placeholder="At least 6 characters" autocomplete="current-password"></div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;">

        <button class="btn btn-outline btn-sm" data-action="fb-sign-up">Create account</button>

  } else {

function bindCloudSyncEvents() {
  const on = (sel, fn) => { const e = document.querySelector(sel); if (e) e.addEventListener('click', fn); };
  on('[data-action="save-fb-config"]', saveCloudConfigFromInput);
  on('[data-action="fb-sign-in"]', cloudSignIn);
  on('[data-action="fb-sign-up"]', cloudSignUp);
  on('[data-action="fb-reset-password"]', cloudResetPassword);
  on('[data-action="fb-sign-out"]', cloudSignOutAction);
  on('[data-action="fb-sync-now"]', pushToCloudNow);
  on('[data-action="remove-fb-config"]', removeCloudConfigAction);
}

window.addEventListener('online', () => { if (cloudUser) setCloudStatus('syncing'); pushToCloudNow(); });
window.addEventListener('offline', () => { if (cloudUser) setCloudStatus('error', 'Offline — changes are saved locally and will sync when you reconnect.'); });

if (window.fb) initFirebaseIfConfigured();
window.addEventListener('fb-sdk-ready', initFirebaseIfConfigured);
if (cloudConfig && !window.fb) {
  setTimeout(() => {
    if (!fbApp) setCloudStatus('error', 'Could not reach the cloud sync library — check your internet connection.');
  }, 9000);
}

function renderApp() {

function renderHeaderAndTimeline() {
  const s = state.settings;
  const start = s.startDate;
  const end = s.extended && s.extendedEndDate ? s.extendedEndDate : addMonthsISO(start, 6);
  const today = todayISO();
  const segCount = 6;
  const elapsedDays = Math.max(0, daysBetween(start, today));
  const totalDays = Math.max(1, daysBetween(start, end));
  const fracElapsed = Math.min(1, elapsedDays / totalDays);
  const daysRemaining = Math.max(0, daysBetween(today, end));
  const overdue = today > end;

  let segs = '';
  for (let i = 0; i < segCount; i++) {
    const segStart = i / segCount, segEnd = (i + 1) / segCount;
    let fill = 0;
    if (fracElapsed >= segEnd) fill = 1;
    else if (fracElapsed <= segStart) fill = 0;
    else fill = (fracElapsed - segStart) / (segEnd - segStart);
    segs += `
      <div class="seg">
        <div class="seg-track"><div class="seg-fill" style="width:${(fill * 100).toFixed(1)}%"></div></div>
        <div class="seg-label mono">M${i + 1}</div>
      </div>`;
  }

  document.getElementById('header-timeline').innerHTML = `
    <div class="row-between" style="margin-bottom:22px; align-items:flex-end;">
      <div>
        <div class="eyebrow">Associate PI Scheme · ${esc(s.studyName || 'Study')}</div>
        <h1 class="serif title">${s.name ? esc(s.name) + "'s tenure log" : 'Your tenure log'}</h1>
        <div class="subtitle">${esc(s.site)}${s.piName ? ' · PI: ' + esc(s.piName) : ''}</div>
      </div>
    </div>
    <div class="card card-pad" style="margin-bottom:6px;">
      <div class="row-between" style="margin-bottom:12px;">
        <div style="display:flex; align-items:baseline; gap:12px;">
          <span class="serif" style="font-size:1.1rem;">Tenure timeline</span>
          <span class="mono" style="font-size:.78rem; color:var(--muted);">${formatDate(start)} → ${formatDate(end)}</span>
        </div>
        <span class="mono" style="font-size:.78rem; padding:2px 9px; border-radius:5px; background:${overdue ? 'rgba(var(--accent-rust-rgb),.1)' : 'rgba(var(--accent-teal-rgb),.1)'}; color:${overdue ? 'var(--accent-rust)' : 'var(--accent-teal)'};">
          ${overdue ? 'Tenure period ended' : daysRemaining + ' days remaining'}
        </span>
      </div>
      <div class="segbar">${segs}</div>
      ${s.extended ? `<div style="font-size:.78rem; color:var(--accent-amber); margin-top:10px; display:flex; align-items:center; gap:6px;">${icon('info')} Extended tenure — new end date ${formatDate(s.extendedEndDate)}</div>` : ''}
    </div>
  `;
}

function computeMandatedDone() {
  return MANDATED_ITEMS.filter((item) => {
    const v = state.checklist[item.id] && state.checklist[item.id].value;
    return item.type === 'checkbox' ? !!v : !!(v && String(v).trim().length > 0);
  }).length;
}

function computeAllReminders() {
  const auto = buildAutoReminders(state.settings).map((r) => ({
    ...r, done: !!state.autoRemindersDone[r.key], auto: true,
  }));
  const custom = state.reminders.map((r) => ({ ...r, auto: false }));
  return [...auto, ...custom].sort((a, b) => (a.due < b.due ? -1 : 1));
}

function renderOverviewTab() {
  const mandatedDone = computeMandatedDone();
  const all = computeAllReminders();
  const upcoming = all.filter((r) => !r.done);
  const today = todayISO();
  const nextFour = upcoming.slice(0, 4);
  const r = state.recruitment;

  return `
    <div class="alert" style="margin-bottom:22px;">
      ${icon('info', 'icon-lg')}
      <div>
        <div class="alert-title">NIHR Learn checklist can lose content</div>
        <div class="alert-desc">NIHR Learn has warned that checklist entries are sometimes wiped. This tracker is your durable backup — fill it in here first, then use the copy buttons on the checklist tab to paste your answers back into NIHR Learn.</div>
      </div>
    </div>

    <div class="grid-4" style="margin-bottom:22px;">
      <div class="card stat-card"><div class="stat-label">Mandated items done</div><div class="serif stat-value">${mandatedDone}/${MANDATED_ITEMS.length}</div></div>
      <div class="card stat-card"><div class="stat-label">Additional activities</div><div class="serif stat-value">${state.activities.length}</div></div>

function checklistFullText() {
  return MANDATED_ITEMS.map((item) => {
    const entry = state.checklist[item.id];
    const val = item.type === 'checkbox'
      ? (entry && entry.value ? 'Confirmed' : 'Not yet confirmed')
      : ((entry && entry.value) || '(not yet answered)');
    return `${item.id}. ${item.label}\n${val}\n`;
  }).join('\n');
}

function renderChecklistTab() {
  return `
    <div class="row-between section-head">
      <div>
        <div class="eyebrow">12 required activities</div>
        <div class="serif section-title">Mandated checklist</div>
        <p class="section-desc">These mirror the Associate PI Checklist on NIHR Learn. Fill them in here, then copy your answers across.</p>
      </div>
      <button class="btn btn-outline btn-sm" data-action="copy-checklist">${icon('copy')} Copy all answers</button>
    </div>
    ${MANDATED_ITEMS.map((item) => {
      const entry = state.checklist[item.id] || { value: item.type === 'checkbox' ? false : '' };
      const done = item.type === 'checkbox' ? !!entry.value : !!(entry.value && String(entry.value).trim().length > 0);
      return `
        <div class="checklist-item">
          <div id="ind-${item.id}" style="margin-top:1px; color:${done ? 'var(--accent-teal)' : 'var(--line)'};">${icon(done ? 'check-circle' : 'circle', 'icon-lg')}</div>
          <div style="flex:1; min-width:0;">
            <div class="idx mono">Item ${item.id}</div>
            <div class="label">${esc(item.label)}</div>
            ${item.type === 'checkbox' ? `
              <label class="chk-row">
                <input type="checkbox" data-chk="${item.id}" ${entry.value ? 'checked' : ''}>
                I confirm this.
              </label>
            ` : `
              <textarea data-chk="${item.id}" placeholder="Write a journal-style entry…">${esc(entry.value)}</textarea>
            `}
            <div id="upd-${item.id}" class="updated mono">${entry.updatedAt ? 'Updated ' + formatDate(entry.updatedAt) : ''}</div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function bindChecklistEvents() {
  MANDATED_ITEMS.forEach((item) => {
    const el = document.querySelector(`[data-chk="${item.id}"]`);
    if (!el) return;
    const evt = item.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(evt, (e) => {
      const val = item.type === 'checkbox' ? e.target.checked : e.target.value;
      state.checklist[item.id] = { value: val, updatedAt: todayISO() };
      save();
      const done = item.type === 'checkbox' ? !!val : !!(val && String(val).trim().length > 0);
      const ind = document.getElementById('ind-' + item.id);
      if (ind) { ind.style.color = done ? 'var(--accent-teal)' : 'var(--line)'; ind.innerHTML = icon(done ? 'check-circle' : 'circle', 'icon-lg'); }
      const upd = document.getElementById('upd-' + item.id);
      if (upd) upd.textContent = 'Updated ' + formatDate(todayISO());
    });
  });
}

function removeJournal(id) {
  state.journal = state.journal.filter((j) => j.id !== id);

function resetAllData() {
  state = defaultData();
  save();
  renderApp();
}

function importBackup(jsonText) {
  try {
    const parsed = JSON.parse(jsonText);
    const base = defaultData();
    state = {
      ...base,
      ...parsed,
      settings: { ...base.settings, ...(parsed.settings || {}) },
      checklist: { ...base.checklist, ...(parsed.checklist || {}) },
    };
    save();
    renderApp();
    showToast('Backup imported.');
  } catch (e) {
    showToast("That file doesn't look like a valid backup.");
  }
}

      save();
      renderHeaderAndTimeline();
      if (key === 'startDate') {
        const preview = document.getElementById('planned-end-preview');
        if (preview) preview.textContent = 'Planned end date: ' + formatDate(addMonthsISO(s.startDate, 6)) + ' (start date + 6 months)';
      }
    });
  };
  bindText('set-name', 'name');
  bindText('set-role', 'role');
  bindText('set-pi', 'piName');
  bindText('set-study', 'studyName');
  bindText('set-start', 'startDate');

  const siteEl = document.getElementById('set-site');
  if (siteEl) siteEl.addEventListener('change', (e) => { s.site = e.target.value; save(); renderHeaderAndTimeline(); });

  const extEl = document.getElementById('set-extended');
  if (extEl) extEl.addEventListener('change', (e) => {
    s.extended = e.target.checked;
    if (!s.extended) s.extendedEndDate = '';
    save();
    renderTabContent();
    renderHeaderAndTimeline();
  });

  const extEndEl = document.getElementById('set-extended-end');
  if (extEndEl) extEndEl.addEventListener('input', (e) => { s.extendedEndDate = e.target.value; save(); renderHeaderAndTimeline(); });
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;

  if (action === 'switch-tab') { switchTab(t.dataset.tab); return; }
  if (action === 'add-activity') { addActivity(); return; }
  if (action === 'remove-activity') { removeActivity(t.dataset.id); return; }
  if (action === 'add-consent-reflection') { addConsentReflection(); return; }
  if (action === 'remove-consent-reflection') { removeConsentReflection(t.dataset.id); return; }
  if (action === 'add-ae') { addAe(); return; }
  if (action === 'remove-ae') { removeAe(t.dataset.id); return; }
  if (action === 'add-reminder') { addReminder(); return; }
  if (action === 'remove-reminder') { removeReminder(t.dataset.id); return; }
  if (action === 'add-journal') { addJournal(); return; }
  if (action === 'remove-journal') { removeJournal(t.dataset.id); return; }

  if (action === 'copy-checklist') {
    const ok = await copyText(checklistFullText());
    showToast(ok ? 'Checklist answers copied.' : 'Copy failed — select and copy manually.');
    return;
  }
  if (action === 'copy-activities') {
    const ok = await copyText(activitiesFullText());
    showToast(ok ? 'Activity log copied.' : 'Copy failed — select and copy manually.');
    return;
  }
  if (action === 'copy-backup') {
    const ok = await copyText(JSON.stringify(state, null, 2));
    showToast(ok ? 'Backup copied to clipboard.' : 'Copy failed — try Download instead.');
    return;
  }
  if (action === 'download-backup') {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'associate-pi-tracker-backup.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return;
  }
  if (action === 'trigger-import') {
    document.getElementById('import-file-input').click();
    return;
  }
  if (action === 'reset-confirm') {
    document.getElementById('reset-confirm-row').innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span style="font-size:.8rem; color:var(--accent-rust);">Delete everything? This can't be undone.</span>
        <button class="btn btn-danger btn-sm" data-action="reset-yes">Yes, reset</button>
        <button class="btn btn-outline btn-sm" data-action="reset-cancel">Cancel</button>
      </div>
    `;
    return;
  }
  if (action === 'reset-yes') { resetAllData(); return; }
  if (action === 'reset-cancel') { document.getElementById('reset-confirm-row').innerHTML = ''; return; }
});

document.addEventListener('change', (e) => {
  if (e.target.matches('[data-action="toggle-auto-reminder"]')) { toggleAutoReminder(e.target.dataset.key); }
  if (e.target.matches('[data-action="toggle-custom-reminder"]')) { toggleCustomReminder(e.target.dataset.key); }
});

document.getElementById('import-file-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => importBackup(String(reader.result));
  reader.readAsText(file);
  e.target.value = '';
});

/* ---------------------------------------------------------------------- */
/* Boot                                                                      */
/* ---------------------------------------------------------------------- */

renderApp();
</script>
<div id="theme-switch" role="group" aria-label="Colour theme">
  <button class="ts-btn" data-theme-set="sage" title="Sage"><span class="sw" style="background:linear-gradient(135deg,#1F7A72,#B07A22)"></span></button>
  <button class="ts-btn" data-theme-set="indigo" title="Indigo"><span class="sw" style="background:linear-gradient(135deg,#3D52A8,#6E86E0)"></span></button>
  <button class="ts-btn" data-theme-set="warm" title="Warm"><span class="sw" style="background:linear-gradient(135deg,#557A4C,#B0752A)"></span></button>
</div>
<script>
(function(){
  var KEY='paladin-theme', root=document.documentElement;
  root.setAttribute('data-theme', localStorage.getItem(KEY) || 'warm');
  function mark(){ var cur=root.getAttribute('data-theme');
    document.querySelectorAll('#theme-switch .ts-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.themeSet===cur); }); }
  document.getElementById('theme-switch').addEventListener('click', function(e){
    var b=e.target.closest('[data-theme-set]'); if(!b) return;
    root.setAttribute('data-theme', b.dataset.themeSet);
    try{ localStorage.setItem(KEY, b.dataset.themeSet); }catch(_){}
    mark();
  });
  mark();
})();
</script>
</body>
</html>
